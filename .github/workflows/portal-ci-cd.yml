# ====================================================================
# Portal CI/CD — Hermes Enterprise Portal
# ====================================================================
# Pipeline exclusivo para el Portal Hermes (AS-HermesPortal)
# Despliega en ASP-HERMES-PORTAL con infraestructura propia
# ====================================================================

name: Portal CI/CD

permissions:
  contents: read
  id-token: write

on:
  push:
    paths:
      - 'Hermes.Web/**'
      - 'requirements.txt'
      - '.github/workflows/portal-ci-cd.yml'
    branches: [ main ]
  workflow_dispatch:
    inputs:
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'auto'
        type: string

env:
  APP_NAME: as-hermesportal
  RESOURCE_GROUP: RG-Hermes-Proyectos
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Portal structure
        run: |
          echo "Portal CI/CD — CorrelationId: ${CORRELATION_ID}"
          echo "Target: ${APP_NAME}.azurewebsites.net"
          test -f Hermes.Web/backend/main.py && echo "OK: main.py"
          test -f Hermes.Web/deployment/startup.sh && echo "OK: startup.sh"
          test -f Hermes.Web/requirements.txt && echo "OK: requirements.txt (Hermes.Web/)"
          echo "Validation complete"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Hermes.Web/requirements.txt 2>&1

      - name: Validate Portal imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

      - name: Validate Portal entrypoint (backend.main:app)
        run: |
          # Probar entrypoint definitivo desde Hermes.Web/
          # Este es el mismo que usará Azure en producción
          cd Hermes.Web
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          from backend.main import app
          print(f'Portal FastAPI app: {app.title}')
          print(f'Routes: {len(app.routes)}')
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          assert '/' in routes, 'Missing /'
          assert '/health' in routes, 'Missing /health'
          print('Portal entrypoint validated (backend.main:app)')
          " 2>&1
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Configure startup command BEFORE deploy (CRITICAL: order matters)"
        shell: bash
        run: |
          echo "=== Setting startup command BEFORE deploy ==="
          echo "Target: deployment/startup.sh"
          echo "Current: $(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)"
          az webapp config set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --startup-file "deployment/startup.sh"
          echo "Updated: $(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)"

      - name: Deploy to Azure Web App
        shell: bash
        run: |
          ZIP_FILE="/tmp/portal-deploy-${{ github.sha }}.zip"
          echo "=== Creating deployment package ==="
          # RC93: ZIP root = contenido de Hermes.Web/
          #   backend/      ← Hermes.Web/backend/
          #   api/          ← Hermes.Web/api/
          #   middleware/   ← Hermes.Web/middleware/
          #   templates/    ← Hermes.Web/templates/
          #   data/         ← Hermes.Web/data/
          #   requirements.txt  ← Hermes.Web/requirements.txt
          #   deployment/startup.sh
          cd Hermes.Web
          zip -r "$ZIP_FILE" . \
            -x '__pycache__/*' '.venv/*' '*.pyc'
          cd ..
          echo "Package contents:"
          unzip -l "$ZIP_FILE" | head -40
          echo "Package size: $(du -sh "$ZIP_FILE" | cut -f1)"
          echo "=== Deploying ${{ env.APP_NAME }} ==="
          az webapp deploy \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --src-path "$ZIP_FILE" \
            --type zip \
            --clean true \
            --restart true
          echo "=== Deploy submitted ==="

      - name: Verify startup command after deploy
        shell: bash
        run: |
          CMD=$(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)
          echo "=== Startup command after deploy: ${CMD} ==="
          if [ "${CMD}" != "deployment/startup.sh" ]; then
            echo "ERROR: Startup command was reset! Re-setting..."
            az webapp config set --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --startup-file "deployment/startup.sh"
          fi

  smoketest:
    name: Smoke Test
    if: success() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Portal readiness
        run: |
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "Polling ${URL}/health for readiness..."
          MAX_ATTEMPTS=90
          ATTEMPT=1
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Checking ${URL}/health ..."
            HTTP_CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "${URL}/health" 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Portal is READY (HTTP 200)"
              curl -s --connect-timeout 10 --max-time 15 "${URL}/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  app={d.get(\"aplicacion\",\"?\")}, estado={d.get(\"estado\",\"?\")}')" 2>/dev/null || true
              break
            fi
            echo "  HTTP ${HTTP_CODE} — waiting 10s..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ ${ATTEMPT} -gt ${MAX_ATTEMPTS} ]; then
            echo "FAIL: Portal not ready after $((MAX_ATTEMPTS * 10)) seconds"
            echo "Last HTTP code: ${HTTP_CODE}"
            exit 1
          fi

      - name: Portal Smoke Tests
        shell: bash
        run: |
          SMOKE_LOG="${RUNNER_TEMP}/portal-smoke-${CORRELATION_ID}.log"
          exec 5>&1
          exec > >(tee -a "${SMOKE_LOG}") 2>&1
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          CORR_ID="${CORRELATION_ID}"
          ALL_PASS=true; FAIL_COUNT=0; PASS_COUNT=0
          fail() { FAIL_COUNT=$((FAIL_COUNT + 1)); ALL_PASS=false; echo "FAIL: $1"; }
          pass() { PASS_COUNT=$((PASS_COUNT + 1)); echo "PASS: $1"; }
          echo "=== PORTAL SMOKE TEST ==="
          echo "URL: $URL | CorrelationId: $CORR_ID"

          echo "--- [HTTP Status] ---"
          for EP in "/health" "/" "/openapi.json"; do
            CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL$EP")
            [ "$CODE" -eq 200 ] && pass "GET $EP -> 200" || fail "GET $EP -> $CODE"
          done

          echo "--- [Health Check] ---"
          HEALTH=$(curl -s --connect-timeout 10 --max-time 15 "$URL/health")
          echo "$HEALTH" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('estado')=='saludable'" && pass "Health: estado=saludable" || fail "Health invalid"

          echo "--- [Root Page] ---"
          ROOT=$(curl -s --connect-timeout 10 --max-time 15 "$URL/")
          echo "$ROOT" | grep -qi "Hermes" && pass "Root: Hermes content" || fail "Root: missing Hermes"

          echo "--- [Swagger] ---"
          CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL/docs")
          [ "$CODE" -eq 200 ] && pass "Swagger: 200" || fail "Swagger: $CODE"

          echo "--- [Factory API] ---"
          curl -s --connect-timeout 10 --max-time 15 "$URL/api/fabrica/proyectos" | python3 -c "import sys,json;d=json.load(sys.stdin)" 2>/dev/null && pass "Factory API: valid" || fail "Factory API: invalid"

          echo "--- [Proyectos Page] ---"
          CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL/proyectos")
          [ "$CODE" -eq 200 ] && pass "Proyectos: 200" || fail "Proyectos: $CODE"

          echo "--- [OpenAPI] ---"
          curl -s --connect-timeout 10 --max-time 15 "$URL/openapi.json" | python3 -c "import json,sys;spec=json.load(sys.stdin);p=spec.get('paths',{});assert '/health' in p;assert '/' in p;print('OpenAPI OK')" 2>/dev/null && pass "OpenAPI: paths OK" || fail "OpenAPI: missing paths"

          echo "=== RESULTS: $PASS_COUNT passed, $FAIL_COUNT failed ==="
          [ "$ALL_PASS" = false ] && { echo "=== PORTAL SMOKE TEST FAILED ==="; exit 1; }
          echo "=== ALL PORTAL SMOKE TESTS PASSED ==="
        env:
          CORRELATION_ID: ${{ env.CORRELATION_ID }}