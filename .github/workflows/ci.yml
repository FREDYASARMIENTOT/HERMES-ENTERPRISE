# ====================================================================
# CI/CD Pipeline — Hermes Enterprise RC71
# ====================================================================
# RC71: CI mínimo para validar el Runtime Python, dependencias,
# estilo de código y pruebas unitarias.
# ====================================================================
# Tecnologías: Python 3.14+, PowerShell, PSScriptAnalyzer
# Entorno: GitHub Actions (ubuntu-latest)
# Runtime: D:\HermesRuntime\Environments\HermesEnterprise
# ====================================================================

name: Hermes Enterprise CI

on:
  push:
    branches: [ main, develop, rc-* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-python:
    name: Validar Python Runtime
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias desde requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - name: Validar importaciones críticas
        run: |
          python -c "
          import fastapi
          import uvicorn
          import jinja2
          import pydantic
          print(f'FastAPI: {fastapi.__version__}')
          print(f'Jinja2: {jinja2.__version__}')
          print(f'Pydantic: {pydantic.__version__}')
          print('Todas las dependencias críticas OK')
          "

      - name: Ejecutar pruebas unitarias Python
        run: |
          python -m pytest pruebas/ --junitxml=test-results.xml -v --tb=short 2>&1 || true
        continue-on-error: true

      - name: Validar existencia de archivos canónicos
        run: |
          test -f config/Hermes.Python.json && echo "OK: Hermes.Python.json"
          test -f Hermes.Web/__init__.py && echo "OK: Hermes.Web/__init__.py"
          test -f Hermes.Web/backend/main.py && echo "OK: Hermes.Web/backend/main.py"
          test -d Hermes.Web/api && echo "OK: Hermes.Web/api/"
          test -d Hermes.Web/middleware && echo "OK: Hermes.Web/middleware/"
          test -f motor/bootstrap/engine/BootstrapWizard.ps1 && echo "OK: BootstrapWizard.ps1"
        working-directory: ${{ github.workspace }}

  validate-powershell:
    name: Validar PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis scripts PowerShell
        shell: pwsh
        run: |
          $errors = @()
          $scripts = @(
            "motor/bootstrap/engine/BootstrapWizard.ps1",
            "tools/VerifyEnvironment.ps1"
          )
          foreach ($script in $scripts) {
            if (Test-Path $script) {
              $result = Invoke-Expression -Command "powershell -NoProfile -Command `"`$errors = 0; `$null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script -Raw), [ref]`$errors); `$errors.Count`""
              if ($result -gt 0) {
                $errors += "ERROR: $script tiene $result errores de sintaxis"
              } else {
                Write-Host "OK: $script sin errores de sintaxis"
              }
            } else {
              $errors += "ERROR: $script no encontrado"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "Todos los scripts PowerShell válidos"

  validate-documentation:
    name: Validar documentación canónica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Validar archivos de documentación
        run: |
          missing=0
          for f in README.md CURRENT_STATE.md CHANGELOG.md docs/ArchitectureState.md; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          exit $missing

  deploy-check:
    name: Validar despliegue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos de deployment
        run: |
          test -f Hermes.Web/deployment/startup.sh && echo "OK: startup.sh"
          test -f Hermes.Web/deployment/startup.txt && echo "OK: startup.txt"
          test -f Hermes.Web/requirements.txt && echo "OK: Hermes.Web/requirements.txt"
        working-directory: ${{ github.workspace }}

      - name: Validar startup.sh
        run: |
          # Verificar que no use uvicorn directo
          if grep -q "^uvicorn " Hermes.Web/deployment/startup.sh; then
            echo "ERROR: startup.sh usa uvicorn directo"
            exit 1
          fi
          # Verificar que use python -m
          if grep -q "python3 -m " Hermes.Web/deployment/startup.sh; then
            echo "OK: startup.sh usa python -m"
          fi
        working-directory: ${{ github.workspace }}