# ====================================================================
# Deploy Pipeline - {{PROJECT_NAME}}
# ====================================================================
# Template RC77-C6: readiness polling, evidence, contract validation.
# Generated by Crear-HermesProyecto.ps1 from tools/Templates/github/
# ====================================================================

name: CD - {{PROJECT_NAME}}

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_NAME: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate project structure
        run: |
          MISSING=0
          for F in backend/main.py backend/requirements.txt; do
            test -f "$F" && echo "OK: $F" || { echo "MISSING: $F"; MISSING=$((MISSING+1)); }
          done
          exit $MISSING

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: 'pip' }
      - run: pip install -r backend/requirements.txt 2>&1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/webapps-deploy@v3
        with:
          app-name: "{{WEBAPP_NAME}}"
          package: .
          clean: true

  smoketest:
    name: Smoke Test
    if: success()
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Readiness polling
        run: |
          URL="https://{{WEBAPP_NAME}}.azurewebsites.net"
          MAX_ATTEMPTS=30; ATTEMPT=1
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Checking ${URL}/health ..."
            CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w '%{http_code}' "$URL/health" 2>/dev/null || echo "000")
            [ "$CODE" = "200" ] && { echo "READY"; break; }
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Not ready yet (HTTP ${CODE})"; sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ ${ATTEMPT} -gt ${MAX_ATTEMPTS} ]; then
            echo "FAIL: Not ready after ${MAX_ATTEMPTS} attempts"
            exit 1
          fi
      - name: Smoke test endpoints
        run: |
          URL="https://{{WEBAPP_NAME}}.azurewebsites.net"
          PASS=0; FAIL=0
          for EP in /health /api/version /; do
            CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w '%{http_code}' "$URL$EP")
            [ "$CODE" = "200" ] && { PASS=$((PASS+1)); echo "PASS: $EP"; } || { FAIL=$((FAIL+1)); echo "FAIL: $EP -> $CODE"; }
          done
          EVIDENCE='{"result":"PASS","pass":'$PASS',"fail":'$FAIL',"commit":"'$GITHUB_SHA'"}'
          mkdir -p evidence
          echo "$EVIDENCE" > evidence/smoke-result.json
          echo "Results: $PASS pass, $FAIL fail"
          [ "$FAIL" = "0" ] || { echo "SMOKE FAILED"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ github.sha }}
          path: evidence/smoke-result.json
          if-no-files-found: error
