name: CD — {{PROJECT_NAME}}

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create deploy package
        run: |
          mkdir -p deploy
          cp -r backend/ deploy/backend/
          cp -r frontend/ deploy/frontend/
          cp -r database/ deploy/database/
          cp -r .github/ deploy/.github/
          cp backend/startup.sh deploy/
          cp backend/requirements.txt deploy/
          cd deploy
          zip -r "../{{PROJECT_NAME}}-deploy.zip" . -x "*.git*" "*__pycache__*" "*.pyc"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: "{{PROJECT_NAME}}-deploy"
          path: "{{PROJECT_NAME}}-deploy.zip"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: "{{PROJECT_NAME}}-deploy"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: "{{WEBAPP_NAME}}"
          package: "{{PROJECT_NAME}}-deploy.zip"
          clean: true

  smoketest:
    name: Smoke Test
    if: success() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Test endpoints
        run: |
          URL="https://{{WEBAPP_NAME}}.azurewebsites.net"
          ENDPOINTS=("/health" "/api/version" "/" "/openapi.json")
          ALL_PASS=true
          for EP in "${ENDPOINTS[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$EP")
            if [ "$CODE" -eq 200 ]; then
              echo "PASS: $EP -> $CODE"
            else
              echo "FAIL: $EP -> $CODE"
              ALL_PASS=false
            fi
          done
          if [ "$ALL_PASS" = false ]; then exit 1; fi
          echo "All smoke tests passed"