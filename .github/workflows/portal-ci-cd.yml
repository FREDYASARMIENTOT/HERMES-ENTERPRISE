# ====================================================================
# Portal CI/CD — Hermes Enterprise Portal
# ====================================================================
# Pipeline exclusivo para el Portal Hermes (AS-HermesPortal)
# Despliega en ASP-HERMES-PORTAL con infraestructura propia
# ====================================================================

name: Portal CI/CD

permissions:
  contents: read
  id-token: write

on:
  push:
    paths:
      - 'Hermes.Web/**'
      - 'requirements.txt'
      - '.github/workflows/portal-ci-cd.yml'
    branches: [ main ]
  workflow_dispatch:
    inputs:
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'auto'
        type: string

env:
  APP_NAME: as-hermesportal
  RESOURCE_GROUP: RG-Hermes-Proyectos
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Portal structure
        run: |
          echo "Portal CI/CD — CorrelationId: ${CORRELATION_ID}"
          echo "Target: ${APP_NAME}.azurewebsites.net"
          test -f Hermes.Web/backend/main.py && echo "OK: main.py"
          test -f Hermes.Web/deployment/startup.sh && echo "OK: startup.sh"
          test -f Hermes.Web/requirements.txt && echo "OK: requirements.txt (Hermes.Web/)"
          echo "Validation complete"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Hermes.Web/requirements.txt 2>&1

      - name: Validate Portal imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

      - name: Validate Portal entrypoint (backend.main:app)
        run: |
          # Probar entrypoint definitivo desde Hermes.Web/
          # Este es el mismo que usará Azure en producción
          cd Hermes.Web
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          from backend.main import app
          print(f'Portal FastAPI app: {app.title}')
          print(f'Routes: {len(app.routes)}')
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          assert '/' in routes, 'Missing /'
          assert '/health' in routes, 'Missing /health'
          print('Portal entrypoint validated (backend.main:app)')
          " 2>&1

      - name: Build self-contained package (pre-installed deps)
        run: |
          echo "=== Pre-installing pip packages into __deps__/ ==="
          cd Hermes.Web
          pip install -r requirements.txt --target ./__deps__ --no-compile -q 2>&1
          echo "=== __deps__/ contents ==="
          ls -la __deps__/ 2>&1 || true
          echo "Total packages: $(ls __deps__/ | wc -l)"
          cd ..
          echo "=== Self-contained package ready ==="

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Configure startup command and build BEFORE deploy (CRITICAL: order matters)"
        shell: bash
        run: |
          echo "=== Setting SCM_DO_BUILD_DURING_DEPLOYMENT=false (self-contained package) ==="
          echo "=== Dependencies pre-installed in __deps__/ during Build phase ==="
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings "SCM_DO_BUILD_DURING_DEPLOYMENT=false"
          echo "=== Setting HERMES_DB_PATH to writable /home/data/proyecto.db ==="
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings "HERMES_DB_PATH=/home/data/proyecto.db"
          echo "=== Setting HERMES_GITHUB_TOKEN for Factory Runner dispatch ==="
          echo "=== Source: GH_PORTAL_HERMES_REPO_WRITE_TOKEN (GitHub Secret) ==="
          echo "=== Security: value NEVER printed, NEVER stored in code ==="
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings "HERMES_GITHUB_TOKEN=${{ secrets.GH_PORTAL_HERMES_REPO_WRITE_TOKEN }}"
          echo "=== Metadata: creating /home/data/ via startup.sh ==="
          echo "=== Setting startup command BEFORE deploy ==="
          echo "Target: deployment/startup.sh"
          echo "Current: $(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)"
          az webapp config set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --startup-file "deployment/startup.sh"
          echo "Updated: $(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)"

      - name: Deploy to Azure Web App
        shell: bash
        run: |
          ZIP_FILE="/tmp/portal-deploy-${{ github.sha }}.zip"
          echo "=== Pre-installing pip packages into __deps__/ ==="
          cd Hermes.Web
          pip install -r requirements.txt --target ./__deps__ --no-compile -q 2>&1
          echo "=== __deps__/ contents ==="
          ls -la __deps__/ 2>&1 || true
          echo "Total packages: $(ls __deps__/ | wc -l)"
          echo "=== Creating deployment package (with __deps__/) ==="
          # RC93: ZIP root = contenido de Hermes.Web/
          #   backend/      ← Hermes.Web/backend/
          #   api/          ← Hermes.Web/api/
          #   middleware/   ← Hermes.Web/middleware/
          #   templates/    ← Hermes.Web/templates/
          #   data/         ← Hermes.Web/data/
          #   __deps__/     ← pre-installed pip packages
          #   requirements.txt  ← Hermes.Web/requirements.txt
          #   deployment/startup.sh
          zip -r "$ZIP_FILE" . \
            -x '__pycache__/*' '.venv/*' '*.pyc'
          cd ..
          echo "Package contents:"
          unzip -l "$ZIP_FILE" 2>&1 || true
          echo "Package size: $(du -sh "$ZIP_FILE" | cut -f1)"
          echo "=== Deploying ${{ env.APP_NAME }} ==="
          az webapp deploy \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --src-path "$ZIP_FILE" \
            --type zip
          echo "=== Deploy submitted ==="

      - name: Verify startup command and build setting after deploy
        shell: bash
        run: |
          CMD=$(az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "siteConfig.appCommandLine" -o tsv)
          echo "=== Startup command after deploy: ${CMD} ==="
          if [ "${CMD}" != "deployment/startup.sh" ]; then
            echo "ERROR: Startup command was reset! Re-setting..."
            az webapp config set --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --startup-file "deployment/startup.sh"
          fi
          BUILD=$(az webapp config appsettings list --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value" -o tsv)
          echo "=== SCM_DO_BUILD_DURING_DEPLOYMENT after deploy: ${BUILD} ==="
          if [ "${BUILD}" != "false" ]; then
            echo "WARNING: SCM_DO_BUILD_DURING_DEPLOYMENT was reset! Re-setting..."
            az webapp config appsettings set --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --settings "SCM_DO_BUILD_DURING_DEPLOYMENT=false"
          fi
          echo "=== Checking HERMES_GITHUB_TOKEN after deploy ==="
          TOKEN_SET=$(az webapp config appsettings list --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?name=='HERMES_GITHUB_TOKEN'].value" -o tsv)
          if [ -z "${TOKEN_SET}" ]; then
            echo "WARNING: HERMES_GITHUB_TOKEN was reset by deploy! Re-setting from GitHub secret..."
            az webapp config appsettings set \
              --name "${{ env.APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --settings "HERMES_GITHUB_TOKEN=${{ secrets.GH_PORTAL_HERMES_REPO_WRITE_TOKEN }}"
            echo "=== HERMES_GITHUB_TOKEN re-set after deploy ==="
          else
            echo "=== HERMES_GITHUB_TOKEN present after deploy ==="
          fi

      - name: Enable System-Assigned Managed Identity for Portal
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Enabling System-Assigned Managed Identity ==="
          az webapp identity assign --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --output none && echo "MI enabled" || echo "MI may already exist"

      - name: Assign Reader role to Portal MI for App Service Plans access
        continue-on-error: true
        shell: bash
        run: |
          MI_ID=$(az webapp identity show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query principalId -o tsv 2>/dev/null)
          if [ -n "$MI_ID" ]; then
            echo "MI Principal ID: ${MI_ID}"
            # PREREQUISITE: The Reader role MUST be assigned to the Portal's System-Assigned MI
            # one-time before the App Service Plans API will work.
            # The CI/CD OIDC identity (Website Contributor) cannot assign RBAC roles.
            # This step tries but will fail with AuthorizationFailed — that's expected.
            # 
            # To fix, run THIS SCRIPT from Azure Portal Cloud Shell (Owner/UserAccessAdmin):
            #   bash scripts/assign-portal-mi-reader.sh
            #
            # NOTE: --assignee and --assignee-object-id are MUTUALLY EXCLUSIVE in Azure CLI.
            # Only --assignee-object-id is used here.
            if az role assignment create \
              --assignee-object-id "${MI_ID}" \
              --assignee-principal-type "ServicePrincipal" \
              --role "Reader" \
              --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}" \
              --output none 2>&1; then
              echo "Reader role assigned at RG scope"
            else
              echo "NOTE: Reader role not assignable from pipeline (requires Owner/UserAccessAdmin)."
              echo "       Run: bash scripts/assign-portal-mi-reader.sh from Azure Cloud Shell."
            fi
          else
            echo "WARN: No Managed Identity found for Portal"
          fi

  smoketest:
    name: Smoke Test
    if: success() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Portal readiness
        run: |
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "Polling ${URL}/health for readiness..."
          MAX_ATTEMPTS=90
          ATTEMPT=1
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Checking ${URL}/health ..."
            HTTP_CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "${URL}/health" 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Portal is READY (HTTP 200)"
              curl -s --connect-timeout 10 --max-time 15 "${URL}/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  app={d.get(\"aplicacion\",\"?\")}, estado={d.get(\"estado\",\"?\")}')" 2>/dev/null || true
              break
            fi
            echo "  HTTP ${HTTP_CODE} — waiting 10s..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ ${ATTEMPT} -gt ${MAX_ATTEMPTS} ]; then
            echo "FAIL: Portal not ready after $((MAX_ATTEMPTS * 10)) seconds"
            echo "Last HTTP code: ${HTTP_CODE}"
            exit 1
          fi

      - name: Portal Smoke Tests
        shell: bash
        run: |
          SMOKE_LOG="${RUNNER_TEMP}/portal-smoke-${CORRELATION_ID}.log"
          exec 5>&1
          exec > >(tee -a "${SMOKE_LOG}") 2>&1
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          CORR_ID="${CORRELATION_ID}"
          ALL_PASS=true; FAIL_COUNT=0; PASS_COUNT=0
          fail() { FAIL_COUNT=$((FAIL_COUNT + 1)); ALL_PASS=false; echo "FAIL: $1"; }
          pass() { PASS_COUNT=$((PASS_COUNT + 1)); echo "PASS: $1"; }
          echo "=== PORTAL SMOKE TEST ==="
          echo "URL: $URL | CorrelationId: $CORR_ID"

          echo "--- [HTTP Status] ---"
          for EP in "/health" "/" "/openapi.json"; do
            CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL$EP")
            [ "$CODE" -eq 200 ] && pass "GET $EP -> 200" || fail "GET $EP -> $CODE"
          done

          echo "--- [Health Check] ---"
          HEALTH=$(curl -s --connect-timeout 10 --max-time 15 "$URL/health")
          echo "$HEALTH" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('estado')=='saludable'" && pass "Health: estado=saludable" || fail "Health invalid"

          echo "--- [Root Page] ---"
          ROOT=$(curl -s --connect-timeout 10 --max-time 15 "$URL/")
          grep -qi "Portal Web Canónico" <<< "$ROOT" && pass "Root: canonical frontend" || fail "Root: missing canonical frontend"

          echo "--- [Swagger] ---"
          CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL/swagger")
          [ "$CODE" -eq 200 ] && pass "Swagger: 200" || fail "Swagger: $CODE"

          echo "--- [Factory API] ---"
          curl -s --connect-timeout 10 --max-time 15 "$URL/api/fabrica/proyectos" | python3 -c "import sys,json;d=json.load(sys.stdin)" 2>/dev/null && pass "Factory API: valid" || fail "Factory API: invalid"

          echo "--- [App Service Plans API] ---"
          ASP_RETRIES=3
          ASP_DELAY=30
          ASP_PASS=false
          for i in $(seq 1 ${ASP_RETRIES}); do
            ASP_DATA=$(curl -s --connect-timeout 10 --max-time 15 "$URL/api/fabrica/app-service-plans" 2>/dev/null || echo '{"exito":false}')
            if echo "$ASP_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('exito')==True; plans=d.get('planes',[]); assert len(plans)>0; assert any(p.get('resource_group')=='RG-Hermes-Proyectos' for p in plans); print(f'OK: {len(plans)} planes reales de RG-Hermes-Proyectos')" 2>/dev/null; then
              ASP_PASS=true; break
            fi
            echo "  [App Service Plans] Intento ${i}/${ASP_RETRIES} falló, esperando ${ASP_DELAY}s (RBAC propagation)..."
            sleep ${ASP_DELAY}
          done
          if [ "$ASP_PASS" = true ]; then pass "App Service Plans: real, dinamico, RG-Hermes-Proyectos"; else fail "App Service Plans: FAIL"; fi

          echo "--- [HTML Selector Validation] ---"
          ROOT_HTML=$(curl -s --connect-timeout 10 --max-time 15 "$URL/" 2>/dev/null || echo "")
          echo "$ROOT_HTML" | python3 -c "import sys; html=sys.stdin.read(); assert 'app-service-plan-select' in html; assert 'crearProyecto' in html; assert 'cargarPlanes' in html; print('OK: HTML contiene selector dinamico y funciones JS')" 2>/dev/null && pass "HTML selector: presente, dinamico" || fail "HTML selector: ausente"

          echo "--- [Proyectos Page] ---"
          CODE=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" "$URL/proyectos")
          [ "$CODE" -eq 200 ] && pass "Proyectos: 200" || fail "Proyectos: $CODE"

          echo "--- [OpenAPI] ---"
          curl -s --connect-timeout 10 --max-time 15 "$URL/openapi.json" | python3 -c "import json,sys;spec=json.load(sys.stdin);p=spec.get('paths',{});assert '/health' in p;assert '/' in p;print('OpenAPI OK')" 2>/dev/null && pass "OpenAPI: paths OK" || fail "OpenAPI: missing paths"

          echo "=== RESULTS: $PASS_COUNT passed, $FAIL_COUNT failed ==="
          [ "$ALL_PASS" = false ] && { echo "=== PORTAL SMOKE TEST FAILED ==="; exit 1; }
          echo "=== ALL PORTAL SMOKE TESTS PASSED ==="
        env:
          CORRELATION_ID: ${{ env.CORRELATION_ID }}