# ====================================================================
# Deploy Pipeline — Hermes Enterprise Project Factory (DESHABILITADO)
# ====================================================================
# IMPORTANTE: El deploy a AS-HermesEnterprise ha sido deshabilitado
# porque el recurso fue eliminado intencionalmente.
#
# El Portal canónico se despliega mediante portal-ci-cd.yml
# a AS-HermesPortal.
#
# Portal: https://as-hermesportal.azurewebsites.net/
# ====================================================================

name: Hermes CI/CD Pipeline (Legacy — DEPLOY DISABLED)

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Project name to deploy (default: hermesenterprise)'
        required: false
        default: 'hermesenterprise'
        type: string
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'auto'
        type: string

env:
  PROJECT_NAME: ${{ inputs.projectName || 'hermesenterprise' }}
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate project structure
        run: |
          echo "Project: ${PROJECT_NAME}"
          echo "CorrelationId: ${CORRELATION_ID}"
          test -f config/Hermes.Azure.json && echo "OK: Azure config"
          test -f config/Hermes.Python.json && echo "OK: Python config"
          echo "Validation complete"
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1

      - name: Validate Python imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

      - name: Validate Hermes.Web entrypoint
        run: |
          python -c "
          from Hermes.Web.backend.main import app
          print(f'FastAPI app: {app.title}')
          print(f'Routes: {len(app.routes)}')
          assert 'Fábrica de Proyectos UR' in app.title, f'Identity mismatch: {app.title}'
          print('Entrypoint Hermes.Web.backend.main:app validated')
          " 2>&1

  deploy-skip:
    name: 'DEPLOY DISABLED (AS-HermesEnterprise deleted)'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Show deploy disabled message
        run: |
          echo "======================================================"
          echo "  DEPLOY SKIPPED"
          echo ""
          echo "  AS-HermesEnterprise was intentionally deleted."
          echo "  The canonical Portal is deployed via portal-ci-cd.yml"
          echo "  to AS-HermesPortal."
          echo ""
          echo "  Portal: https://as-hermesportal.azurewebsites.net/"
          echo "======================================================"
