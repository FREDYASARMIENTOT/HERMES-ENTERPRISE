# ====================================================================
# Pipeline CI/CD — Hermes Enterprise
# ====================================================================
# RC71: CI mínimo para validar el Runtime Python, dependencias,
# estilo de código y pruebas unitarias.
# ====================================================================
# Tecnologías: Python 3.12, PowerShell, PSScriptAnalyzer
# Entorno: GitHub Actions (ubuntu-latest / windows-latest)
# Runtime: Python 3.12+ with FastAPI
# ====================================================================

name: Hermes Enterprise CI

on:
  push:
    branches: [ main, develop, rc-* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-python:
    name: Validar Python Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar importaciones críticas
        run: |
          python -c "
          import fastapi
          import uvicorn
          import jinja2
          import pydantic
          print(f'FastAPI: {fastapi.__version__}')
          print(f'Jinja2: {jinja2.__version__}')
          print(f'Pydantic: {pydantic.__version__}')
          print('Todas las dependencias críticas OK')
          "

      - name: Validar entrypoint Hermes.Web.backend.main:app
        run: |
          python -c "
          from Hermes.Web.backend.main import app
          print(f'FastAPI app loaded: {app.title}')
          print(f'Routes: {len(app.routes)}')
          print('Entrypoint Hermes.Web.backend.main:app OK')
          "

      - name: Ejecutar pruebas unitarias Python (si existen)
        run: |
          TEST_FILES=$(find . -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | head -5)
          if [ -z "$TEST_FILES" ]; then
            echo "INFO: No se encontraron archivos de prueba Python (test_*.py / *_test.py)."
            echo "INFO: Las pruebas Python se omiten — el repositorio no tiene suite Python."
            echo "result=not_present" >> $GITHUB_OUTPUT
          else
            echo "INFO: Archivos de prueba Python encontrados:"
            echo "$TEST_FILES"
            python -m pytest . --junitxml=test-results.xml -v --tb=short 2>&1
            echo "result=executed" >> $GITHUB_OUTPUT
          fi

      - name: Validar existencia de archivos canónicos
        run: |
          test -f config/Hermes.Python.json && echo "OK: Hermes.Python.json"
          test -f Hermes.Web/__init__.py && echo "OK: Hermes.Web/__init__.py"
          test -d Hermes.Web && echo "OK: Hermes.Web/"
          test -d tools/Modules && echo "OK: tools/Modules/"
          test -f tools/Crear-HermesProyecto.ps1 && echo "OK: Crear-HermesProyecto.ps1"
          test -f config/Hermes.InfrastructureProtection.json && echo "OK: Guardian config"

  validate-powershell:
    name: Validar PowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Validar módulos PowerShell
        shell: pwsh
        run: |
          $parseErrors = @()
          $scripts = @(
            "tools/Modules/Guardian.ps1",
            "tools/Modules/Git.ps1",
            "tools/Modules/GitHub.ps1",
            "tools/Modules/Azure.ps1",
            "tools/Modules/SQLite.ps1",
            "tools/Modules/Packaging.ps1",
            "tools/Modules/Workspace.ps1",
            "tools/Modules/Reporting.ps1",
            "tools/Crear-HermesProyecto.ps1"
          )
          foreach ($script in $scripts) {
            if (Test-Path $script) {
              $tokens = $null
              $parseErr = $null
              $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script -Raw), [ref]$parseErr)
              if ($parseErr -and $parseErr.Count -gt 0) {
                $parseErrors += "ERROR: $script tiene $($parseErr.Count) errores de sintaxis"
                foreach ($err in $parseErr) { Write-Host "  L$($err.Token.StartLine): $($err.Message)" }
              } else {
                Write-Host "OK: $script ($($tokens.Count) tokens)"
              }
            } else {
              $parseErrors += "ERROR: $script no encontrado"
            }
          }
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "Todos los scripts PowerShell válidos"

      - name: Validar renderizado de plantilla Child (canónico)
        shell: pwsh
        run: |
          # Ruta contractual: GITHUB_WORKSPACE es la raíz del repositorio
          # en GitHub Actions. En local se puede usar cualquier directorio
          # siempre que $env:GITHUB_WORKSPACE apunte a la raíz.
          $RaizRepositorio = $env:GITHUB_WORKSPACE
          if (-not $RaizRepositorio) {
            # Fallback para ejecución local fuera de GitHub Actions
            $RaizRepositorio = Resolve-Path "$PSScriptRoot/../.."
          }
          $RutaCanonica = Join-Path $RaizRepositorio "pruebas/canonicas/Test-ChildTemplateRendering.ps1"
          Write-Host "Buscando prueba canónica en: $RutaCanonica"
          if (Test-Path $RutaCanonica) {
            Write-Host "Ejecutando prueba canónica: $RutaCanonica"
            & $RutaCanonica
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: Prueba canónica de template falló (exit code: $LASTEXITCODE)"
              exit 1
            }
            Write-Host "PASS: Prueba canónica de template OK"
          } else {
            Write-Host "FAIL: Prueba canónica NO ENCONTRADA en $RutaCanonica"
            Write-Host "Contenido de pruebas/:"
            Get-ChildItem -Path (Join-Path $RaizRepositorio "pruebas") -Recurse -Name | Where-Object { $_ -match "\.ps1$" } | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

  validate-documentation:
    name: Validar documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Validar archivos de documentación
        run: |
          missing=0
          for f in README.md CURRENT_STATE.md CHANGELOG.md docs/ArchitectureState.md; do
            if [ -f "$f" ]; then echo "OK: $f"; else echo "MISSING: $f"; missing=$((missing + 1)); fi
          done
          exit $missing

  validate-actions:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML for workflow validation
        run: pip install pyyaml

      - name: Validate workflows compile
        shell: python
        run: |
          import yaml, sys
          for wf in ['.github/workflows/ci.yml', '.github/workflows/deploy.yml', '.github/workflows/deploy-child.yml', 'tools/Templates/github/ci.yml']:
              with open(wf) as f:
                  data = yaml.safe_load(f)
              if data and 'jobs' in data:
                  print(f'OK: {wf} ({len(data["jobs"])} jobs)')
              else:
                  print(f'ERROR: {wf}')
                  sys.exit(1)

      - name: Validate critical workflow capabilities (drift detection)
        shell: python
        run: |
          import yaml, sys

          def check_deploy_capabilities(wf_path, label):
              '''Verify deploy workflow has all required capabilities.

              Clasifica workflows legacy/deshabilitados y no los valida.
              '''
              with open(wf_path) as f:
                  first_lines = ''.join([next(f) for _ in range(15)])
                  data = yaml.safe_load(first_lines)
              f.close()

              # ── Detectar workflows legacy/deshabilitados ──
              legacy_patterns = [
                  'DESHABILITADO', 'DEPLOY DISABLED', 'Legacy', 'LEGACY',
                  'eliminado intencionalmente', 'deshabilitado'
              ]
              for pattern in legacy_patterns:
                  if pattern in first_lines:
                      print(f'INFO: {label} — DETECTADO COMO LEGACY/DESHABILITADO (omitido de validación)')
                      return True

              # ── Reabrir para validación real ──
              with open(wf_path) as f:
                  data = yaml.safe_load(f)
              if not data:
                  print(f'FAIL: {label} — could not parse')
                  return False

              jobs = data.get('jobs', {})
              all_ok = True
              all_text = str(data)

              # Check for readiness polling (not sleep)
              if 'sleep 30' in all_text:
                  print(f'FAIL: {label} — uses sleep 30 instead of readiness polling')
                  all_ok = False
              has_polling = ('MAX_ATTEMPTS' in all_text or 'max_attempts' in all_text.lower() or
                             'for i in $(seq' in all_text or 'for(' in all_text.lower() and 'attempt' in all_text.lower())
              if not has_polling:
                  print(f'WARN: {label} — no readiness polling count variable found')

              # Check for evidence generation
              if 'evidence' not in all_text.lower():
                  print(f'WARN: {label} — no evidence generation found')

              # Check for artifact upload (WARN only — deploy workflows use Azure CLI, not artifacts)
              if 'upload-artifact' not in all_text:
                  print(f'INFO: {label} — no artifact upload (expected for Azure CLI deploy workflows)')

              # Check for startup-command (auto-detectado por Azure Runtime Python — opcional)
              if 'startup-command' not in all_text and 'startup-command:' not in all_text:
                  print(f'INFO: {label} — no startup-command (auto-detectado por Azure Runtime)')

              # Check for OpenAPI validation
              if 'openapi' not in all_text.lower() and 'swagger' not in all_text.lower():
                  print(f'INFO: {label} — no OpenAPI/Swagger validation (opcional para deploy)')

              if all_ok:
                  print(f'PASS: {label} — all required capabilities present')
              return all_ok

          def check_ci_capabilities(wf_path, label):
              '''Verify CI workflow has all required capabilities.'''
              with open(wf_path) as f:
                  data = yaml.safe_load(f)
              if not data:
                  print(f'FAIL: {label} — could not parse')
                  return False

              all_text = str(data)
              all_ok = True

              # Check for Python validation
              if 'setup-python' not in all_text:
                  print(f'WARN: {label} — no Python setup')

              # Check for entrypoint validation (exact import text, not just name)
              if 'from Hermes.Web.backend.main import app' not in all_text:
                  print(f'WARN: {label} — no entrypoint validation')

              # Check for workflow validation
              if 'validate-actions' not in all_text and 'yaml.safe_load' not in all_text:
                  print(f'WARN: {label} — no workflow validation')

              # Check for shellcheck/PSScriptAnalyzer
              if 'PSScriptAnalyzer' not in all_text and 'shellcheck' not in all_text.lower():
                  pass  # Optional

              if all_ok:
                  print(f'PASS: {label} — all required capabilities present')
              return all_ok

          all_pass = True
          all_pass &= check_deploy_capabilities('.github/workflows/deploy-child.yml', 'deploy-child.yml (Control Plane)')
          all_pass &= check_deploy_capabilities('.github/workflows/deploy.yml', 'deploy.yml (main app)')
          all_pass &= check_ci_capabilities('.github/workflows/ci.yml', 'ci.yml (real)')
          all_pass &= check_ci_capabilities('tools/Templates/github/ci.yml', 'ci.yml (template)')

          if not all_pass:
              print()
              print('=== DRIFT DETECTED: Some workflows lack critical capabilities ===')
              sys.exit(1)
          print()
          print('=== All workflows validated — no critical drift detected ===')
