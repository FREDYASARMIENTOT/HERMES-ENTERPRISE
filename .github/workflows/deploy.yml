# ====================================================================
# Deploy Pipeline — Hermes Enterprise Project Factory
# ====================================================================
# RC77: Four-stage pipeline for project validation and deployment.
# Validate → Build → Deploy → SmokeTest
# ====================================================================

name: Hermes Project Deploy

on:
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Project name to deploy'
        required: true
        type: string
      correlationId:
        description: 'Correlation ID for tracking'
        required: true
        type: string

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Project: ${{ inputs.projectName }}"
          echo "CorrelationId: ${{ inputs.correlationId }}"
          test -f config/Hermes.Azure.json && echo "OK: Azure config"
          test -f config/Hermes.Python.json && echo "OK: Python config"
          echo "Validation complete"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Validate Python imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: as-${{ inputs.projectName }}
          slot-name: production
          package: .
          clean: true

  smoketest:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Test endpoints
        run: |
          URL="https://as-${{ inputs.projectName }}.azurewebsites.net"
          ENDPOINTS=("/health" "/api/version" "/api/proyecto" "/")
          ALL_PASS=true
          for EP in "${ENDPOINTS[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$EP")
            if [ "$CODE" -eq 200 ]; then
              echo "PASS: $EP -> $CODE"
            else
              echo "FAIL: $EP -> $CODE"
              ALL_PASS=false
            fi
          done
          if [ "$ALL_PASS" = false ]; then exit 1; fi
          echo "All smoke tests passed"