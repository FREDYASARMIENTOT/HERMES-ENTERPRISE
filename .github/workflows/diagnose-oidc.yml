# ====================================================================
# Diagnose OIDC — Verificar claims y client-id (NO expone secrets)
# ====================================================================
# Temporal: Solo para diagnosticar AADSTS700211 en RC77-C3.
# Eliminar después de diagnosticar.
# ====================================================================

name: Diagnose OIDC

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: OIDC Diagnosis
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract OIDC Claims (safe)
        id: claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!token || !url) {
              core.setFailed('No OIDC token - missing id-token:write');
              return;
            }
            const resp = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const data = await resp.json();
            const claims = JSON.parse(
              Buffer.from(data.value.split('.')[1], 'base64').toString()
            );

            // Output as step annotations (safe, no full token)
            core.notice(`iss: ${claims.iss}`);
            core.notice(`sub: ${claims.sub}`);
            core.notice(`azp: ${claims.azp}`);
            core.notice(`env: ${claims.environment}`);

            // Set outputs for next step
            core.setOutput('iss', claims.iss);
            core.setOutput('sub', claims.sub);
            core.setOutput('azp', claims.azp);
            core.setOutput('env', claims.environment);

            // Quick assertion
            if (claims.iss !== 'https://token.actions.githubusercontent.com') {
              core.setFailed(`ISSUER MISMATCH: got ${claims.iss}`);
            }
            if (claims.sub !== 'repo:FREDYASARMIENTOT/HERMES-ENTERPRISE:environment:production') {
              core.setFailed(`SUBJECT MISMATCH: got ${claims.sub}`);
            }
            core.info('iss and sub match expected values ✅');

      - name: Analyze AZP (client-id)
        shell: bash
        run: |
          ISS="${{ steps.claims.outputs.iss }}"
          SUB="${{ steps.claims.outputs.sub }}"
          AZP="${{ steps.claims.outputs.azp }}"
          ENV="${{ steps.claims.outputs.env }}"

          echo "========================================"
          echo "  OIDC CLAIMS VERIFICATION"
          echo "========================================"
          echo "iss (issuer)       : ${ISS}"
          echo "sub (subject)      : ${SUB}"
          echo "azp (client-id)    : ${AZP}"
          echo "environment        : ${ENV}"
          echo "----------------------------------------"

          # Verify issuer
          if [ "${ISS}" = "https://token.actions.githubusercontent.com" ]; then
            echo "✅ Issuer matches expected"
          else
            echo "❌ Issuer MISMATCH"
          fi

          # Verify subject
          if [ "${SUB}" = "repo:FREDYASARMIENTOT/HERMES-ENTERPRISE:environment:production" ]; then
            echo "✅ Subject matches expected"
          else
            echo "❌ Subject MISMATCH"
          fi

          # Verify azp (client-id used by Azure AD to find app reg)
          echo ""
          echo "--- AZURE_CLIENT_ID Verification ---"
          echo "azp claim value : ${AZP}"
          echo "Expected        : feb971aa-7655-4c6f-8aef-b9f3bb828f6b (Client ID)"
          echo "NOT expected    : 5616db94-97be-44d4-8216-f38b704522c2 (SP Object ID)"
          echo ""
          if [ "${AZP}" = "feb971aa-7655-4c6f-8aef-b9f3bb828f6b" ]; then
            echo "✅ AZURE_CLIENT_ID = Application Client ID (CORRECT)"
          elif [ "${AZP}" = "5616db94-97be-44d4-8216-f38b704522c2" ]; then
            echo "❌ AZURE_CLIENT_ID = SP Object ID (WRONG!)"
            echo "   Fix: update GitHub Secret AZURE_CLIENT_ID to feb971aa-7655-4c6f-8aef-b9f3bb828f6b"
          else
            echo "⚠️  UNEXPECTED azp value: ${AZP}"
          fi
          echo "========================================"