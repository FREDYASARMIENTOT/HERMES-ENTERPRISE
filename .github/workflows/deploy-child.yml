# deploy-child.yml — PLANO DE CONTROL DE HERMES-ENTERPRISE
# ====================================================================
# RCXX: Orquesta despliegue de proyectos Hermes hijos desde
# HERMES-ENTERPRISE usando OIDC (FIC existente sin modificar).
#
# Arquitectura:
#   HERMES-ENTERPRISE → OIDC → Azure
#     ├── RG-Hermes-Proyectos     (Web Apps + App Service Plans dinámicos)
#     └── Plan seleccionado por el usuario desde el Portal
#
# Principios:
#   - NO crear App Service Plan (reutilizar plan seleccionado)
#   - NO modificar FIC
#   - NO usar Kudu / publishing profiles
#   - Evidence con resultados REALES
#   - app_service_plan_id recibido como input REQUIRED (workflow_dispatch)
#   - Si app_service_plan_id está ausente: FAIL explícito (no hay fallback)
# ====================================================================

name: Control Plane — Deploy Child Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nombre del proyecto (ej: contabilidad, finanzas, talento)'
        required: true
        type: string
      repository:
        description: 'Repositorio del hijo (formato: FREDYASARMIENTOT/hermes-{project})'
        required: true
        type: string
      commit_sha:
        description: 'SHA del commit a desplegar (40 caracteres hex)'
        required: true
        type: string
      deployment_id:
        description: 'Deployment ID para trazabilidad en Portal'
        required: false
        default: ''
        type: string
      app_service_plan_id:
        description: 'Resource ID del App Service Plan en RG-Hermes-Proyectos (REQUIRED)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  WEBAPP_RESOURCE_GROUP: RG-Hermes-Proyectos
  LOCATION: eastus
  RUNTIME: 'PYTHON:3.12'
  # STARTUP_COMMAND: NO USADO — startup.sh del repositorio hijo se auto-detecta
  # Cuando appCommandLine está vacío, el runtime Python de Azure auto-detecta startup.sh
  # que maneja: pip install, DB init, uvicorn backend.main:app

jobs:
  # ==================================================================
  # TRABAJO 1: validate-inputs — Validación de seguridad de entradas
  # ==================================================================
  validate-inputs:
    name: Validar Entradas
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.validate.outputs.project_name }}
      repository: ${{ steps.validate.outputs.repository }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      app_service_name: ${{ steps.validate.outputs.app_service_name }}
      app_service_plan_id: ${{ steps.validate.outputs.app_service_plan_id }}
      deployment_id: ${{ steps.validate.outputs.deployment_id }}
      validation_result: ${{ steps.validate.outputs.validation_result }}
    steps:
      - name: Validate Inputs (Security)
        id: validate
        shell: bash
        run: |
          PROJ="${{ inputs.project_name }}"
          REPO="${{ inputs.repository }}"
          SHA="${{ inputs.commit_sha }}"

          if ! echo "${PROJ}" | grep -qP '^[a-z0-9-]{3,40}$'; then
            echo "FAIL: project_name invalido: '${PROJ}'"
            echo "  Permitido: solo minusculas, numeros y guiones (3-40 caracteres)"
            exit 1
          fi
          echo "OK: project_name='${PROJ}'"

          if ! echo "${REPO}" | grep -qP '^FREDYASARMIENTOT/[a-zA-Z0-9_.-]{1,100}$'; then
            echo "FAIL: repository invalido: '${REPO}'"
            exit 1
          fi
          echo "OK: repository='${REPO}'"

          if ! echo "${SHA}" | grep -qP '^[0-9a-f]{40}$'; then
            echo "FAIL: commit_sha invalido: '${SHA}'"
            exit 1
          fi
          echo "OK: commit_sha='${SHA}'"

          if echo "${REPO}" | grep -qiP 'https?://|github\.com|git@|ssh://'; then
            echo "FAIL: URL injection detected in repository"
            exit 1
          fi
          echo "OK: No URL injection"

          APP_NAME="as-$(echo "${PROJ}" | sed 's/[^a-z0-9]//g')"

          # Resolver App Service Plan ID (REQUIRED)
          ASP_ID="${{ inputs.app_service_plan_id }}"
          if [ -z "${ASP_ID}" ]; then
            echo "FAIL: app_service_plan_id es REQUIRED. No se proporcionó ningún plan."
            echo "  El usuario debe seleccionar un App Service Plan de RG-Hermes-Proyectos"
            echo "  desde el Portal antes de crear un proyecto."
            exit 1
          fi
          # Validar que el resource ID pertenezca a RG-Hermes-Proyectos con patrón exacto
          ASP_PATTERN='^/subscriptions/01bfad48-c092-4712-bc72-f141eb01a8d4/resourceGroups/RG-Hermes-Proyectos/providers/Microsoft.Web/serverfarms/[a-zA-Z0-9_-]+$'
          if ! echo "${ASP_ID}" | grep -qP "${ASP_PATTERN}"; then
            echo "FAIL: app_service_plan_id no pertenece a RG-Hermes-Proyectos"
            echo "  Valor: ${ASP_ID}"
            echo "  Solo se aceptan planes en el resource group autorizado."
            exit 1
          fi

          echo "project_name=${PROJ}" >> $GITHUB_OUTPUT
          echo "repository=${REPO}" >> $GITHUB_OUTPUT
          echo "commit_sha=${SHA}" >> $GITHUB_OUTPUT
          echo "app_service_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "app_service_plan_id=${ASP_ID}" >> $GITHUB_OUTPUT
          DID="${{ inputs.deployment_id }}"
          if [ -z "${DID}" ]; then DID="${PROJ}"; fi
          echo "deployment_id=${DID}" >> $GITHUB_OUTPUT
          echo "validation_result=PASS" >> $GITHUB_OUTPUT

          echo ""
          echo "=========================================="
          echo "  INPUTS VALIDATED"
          echo "=========================================="
          echo "  Project     : ${PROJ}"
          echo "  Repository  : ${REPO}"
          echo "  SHA         : ${SHA}"
          echo "  Web App     : ${APP_NAME}"
          echo "  ASP ID      : ${ASP_ID}"
          echo "=========================================="

  # ==================================================================
  # TRABAJO 2: checkout-child — Checkout del repositorio hijo en SHA específico
  # ==================================================================
  checkout-child:
    name: Checkout Child
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    outputs:
      checkout_result: ${{ steps.checkout.outputs.checkout_result }}
      deployed_sha: ${{ steps.verify.outputs.deployed_sha }}
      remote_sha: ${{ steps.verify.outputs.remote_sha }}
      sha_chain: ${{ steps.verify.outputs.sha_chain }}
    steps:
      - name: Pre-checkout SHA Verification
        id: pre-verify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PORTAL_HERMES_REPO_WRITE_TOKEN }}
        run: |
          REPO="${{ needs.validate-inputs.outputs.repository }}"
          SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          echo "=== PRE-CHECKOUT SHA VERIFICATION ==="
          echo "Repository: ${REPO}"
          echo "Requested SHA: ${SHA}"
          REMOTE_SHA=$(gh api "/repos/${REPO}/git/commits/${SHA}" --jq '.sha' 2>&1) || true
          if ! echo "${REMOTE_SHA}" | grep -qP '^[0-9a-f]{40}$'; then
            echo "::error::SHA_NOT_IN_REPOSITORY — SHA ${SHA} no encontrado en ${REPO}"
            echo "  El commit solicitado NO EXISTE en el repositorio child."
            echo "  Causa probable: se envió un SHA de otro repositorio (ej: HERMES-ENTERPRISE)."
            exit 1
          fi
          if [ "${REMOTE_SHA}" != "${SHA}" ]; then
            echo "::error::SHA_MISMATCH — API SHA (${REMOTE_SHA}) != requested (${SHA})"
            exit 1
          fi
          echo "PRE-CHECKOUT SHA VERIFICATION: PASS"
          echo "  SHA ${SHA} confirmado en ${REPO}"
          echo "remote_sha=${REMOTE_SHA}" >> $GITHUB_OUTPUT
          echo "=== END PRE-CHECKOUT ==="
      - name: Checkout Child Repository (SHA exacto, sin fallback)
        id: checkout
        shell: bash
        env:
          GH_CHILD_READ_TOKEN: ${{ secrets.GH_CHILD_REPO_READ_TOKEN }}
        run: |
          REPO="${{ needs.validate-inputs.outputs.repository }}"
          SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          REMOTE_SHA="${{ steps.pre-verify.outputs.remote_sha }}"
          TARGET="child-project"
          RETRIES=5
          BACKOFF_DELAYS=(5 10 20 30 60)
          RC=1

          echo "=== CHECKOUT CHILD REPOSITORY ==="
          echo "Repository: ${REPO}"
          echo "Requested SHA: ${SHA}"

          for i in $(seq 1 ${RETRIES}); do
            echo "--- Checkout attempt ${i}/${RETRIES} ---"

            rm -rf "${TARGET}" 2>/dev/null || true

            GIT_URL="https://x-access-token:${GH_CHILD_READ_TOKEN}@github.com/${REPO}.git"
            git clone --depth 1 "${GIT_URL}" "${TARGET}" 2>&1
            CLONE_RC=$?

            if [ ${CLONE_RC} -eq 0 ]; then
              cd "${TARGET}" || continue
              # Verify the clone got the right commit
              CLONED_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
              if [ "${CLONED_SHA}" = "${SHA}" ]; then
                echo "OK: Exact match on clone — ${CLONED_SHA}"
                RC=0
                break
              fi
              # SHA mismatch — try strategies for GitHub propagation delay
              echo "Cloned SHA (${CLONED_SHA}) != requested (${SHA}), trying wider fetch..."

              # Strategy 1: Fetch all to get updated refs
              git fetch origin 2>&1
              git checkout "${SHA}" 2>&1
              CHECKOUT_RC=$?
              if [ ${CHECKOUT_RC} -eq 0 ]; then
                CONFIRMED_SHA=$(git rev-parse HEAD)
                if [ "${CONFIRMED_SHA}" = "${SHA}" ]; then
                  echo "OK: Fetch all + checkout success — ${CONFIRMED_SHA}"
                  RC=0
                  break
                fi
              fi

              # Strategy 2: Direct SHA fetch (handles propagation delay)
              echo "Trying direct SHA fetch..."
              git fetch --depth 50 origin "${SHA}" 2>&1
              git checkout "${SHA}" 2>&1
              CHECKOUT_RC=$?
              if [ ${CHECKOUT_RC} -eq 0 ]; then
                CONFIRMED_SHA=$(git rev-parse HEAD)
                if [ "${CONFIRMED_SHA}" = "${SHA}" ]; then
                  echo "OK: Direct SHA fetch + checkout success — ${CONFIRMED_SHA}"
                  RC=0
                  break
                fi
              fi
            fi

            if [ ${i} -lt ${RETRIES} ]; then
              DELAY=${BACKOFF_DELAYS[$((i-1))]}
              echo "Checkout attempt ${i} failed. Waiting ${DELAY}s before retry..."
              echo "WARNING: NO fallback — siguiente intento usara EXACTAMENTE el mismo SHA"
              sleep ${DELAY}
            fi
          done

          if [ ${RC} -ne 0 ]; then
            echo "::error::CHECKOUT_FAILED after ${RETRIES} retries — SHA ${SHA} inaccesible en ${REPO}"
            echo "  SHA pre-verificado remotamente: ${REMOTE_SHA}"
            echo "  Posible causa: el commit fue eliminado o el token no tiene acceso"
            exit 1
          fi

          echo "checkout_result=PASS" >> $GITHUB_OUTPUT

      - name: Verify SHA Match
        id: verify
        shell: bash
        working-directory: child-project
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          REQUESTED_SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          REMOTE_SHA="${{ steps.pre-verify.outputs.remote_sha }}"
          INPUT_REPO="${{ needs.validate-inputs.outputs.repository }}"
          echo "Actual SHA   : ${ACTUAL_SHA}"
          echo "Requested SHA: ${REQUESTED_SHA}"
          if [ "${ACTUAL_SHA}" != "${REQUESTED_SHA}" ]; then
            echo "FAIL: SHA mismatch — requested ${REQUESTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          echo "OK: SHA verified — ${ACTUAL_SHA}"
          echo "deployed_sha=${ACTUAL_SHA}" >> $GITHUB_OUTPUT

          # SHA_CHAIN summary
          echo ""
          echo "=== SHA_CHAIN ==="
          echo "INPUT_SHA=${REQUESTED_SHA}"
          echo "REMOTE_SHA=${REMOTE_SHA}"
          echo "CHECKOUT_SHA=${ACTUAL_SHA}"
          CHAIN_RESULT="PASS"
          if [ "${REQUESTED_SHA}" != "${REMOTE_SHA}" ]; then CHAIN_RESULT="FAIL"; fi
          if [ "${ACTUAL_SHA}" != "${REQUESTED_SHA}" ]; then CHAIN_RESULT="FAIL"; fi
          echo "SHA_CHAIN_RESULT=${CHAIN_RESULT}"
          echo "REPOSITORY=${INPUT_REPO}"
          echo "================="
          echo "sha_chain=${CHAIN_RESULT}" >> $GITHUB_OUTPUT
          echo "remote_sha=${REMOTE_SHA}" >> $GITHUB_OUTPUT
          if [ "${CHAIN_RESULT}" != "PASS" ]; then
            echo "::error::SHA_CHAIN_FAIL — INPUT_SHA=${REQUESTED_SHA} REMOTE_SHA=${REMOTE_SHA} CHECKOUT_SHA=${ACTUAL_SHA}"
            exit 1
          fi
          echo "checkout_result=PASS" >> $GITHUB_OUTPUT

  # ==================================================================
  # TRABAJO 3: validate-infrastructure — Validación pre-OIDC
  # ==================================================================
  validate-infrastructure:
    name: Validate Infrastructure Params
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    outputs:
      infra_validation: ${{ steps.validate.outputs.infra_validation }}
    steps:
      - name: Validate Infrastructure Configuration
        id: validate
        shell: bash
        run: |
          echo "=== Infrastructure Configuration ==="
          echo "App Service Plan ID : ${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          echo "WebApp Resource Group: ${{ env.WEBAPP_RESOURCE_GROUP }}"
          echo "Web App Name         : ${{ needs.validate-inputs.outputs.app_service_name }}"
          echo "Location             : ${{ env.LOCATION }}"
          echo "Runtime              : ${{ env.RUNTIME }}"
          echo ""
          echo "App Service Plan PROVIDED BY USER (validated):"
          echo "  Plan ID     : ${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          echo "  WebApp RG   : ${{ env.WEBAPP_RESOURCE_GROUP }}"
          echo ""
          echo "OIDC: Only from HERMES-ENTERPRISE (FIC existente)"
          echo ""
          echo "All params validated"
          echo "infra_validation=PASS" >> $GITHUB_OUTPUT

  # ==================================================================
  # TRABAJO 4: oidc-login — Autenticar HERMES-ENTERPRISE en Azure
  # ==================================================================
  oidc-login:
    name: OIDC Login
    runs-on: ubuntu-latest
    environment: production
    needs: [validate-inputs, checkout-child, validate-infrastructure]
    outputs:
      login_result: ${{ steps.verify-auth.outputs.login_result }}
    steps:
      - name: Azure Login (OIDC)
        id: login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Authentication
        id: verify-auth
        shell: bash
        run: |
          echo "=== OIDC Authentication ==="
          echo "Method       : OIDC (Federated Identity Credential)"
          echo "App Reg      : UR-Fabrica-Proyectos-AR"
          echo "Subject      : repo:FREDYASARMIENTOT/HERMES-ENTERPRISE:environment:production"
          echo "Kudu         : NOT USED"
          echo "Client Secret: NOT USED"
          echo "Publishing   : NOT USED"
          ACCOUNT=$(az account show --query "{name:name, id:id}" -o json)
          ACCOUNT_NAME=$(echo "${ACCOUNT}" | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          echo "Account: ${ACCOUNT_NAME}"
          echo "login_result=PASS" >> $GITHUB_OUTPUT

      - name: Verify App Service Plan Exists (Read-Only)
        shell: bash
        run: |
          ASP_ID="${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          echo "=== Verifying App Service Plan ==="
          echo "Resource ID: ${ASP_ID}"
          echo ""
          echo "NOTE: SP scope is RG-Hermes-Proyectos only."
          echo "Plan is validated via ARM resource ID at provision time."
          echo ""
          echo "Validating plan resource ID format..."
          if ! echo "${ASP_ID}" | grep -qP '^/subscriptions/[a-f0-9-]+/resourceGroups/[a-zA-Z0-9_.-]+/providers/Microsoft.Web/serverfarms/[a-zA-Z0-9_-]+$'; then
            echo "FAIL: Invalid plan resource ID format"
            exit 1
          fi
          echo "OK: App Service Plan resource ID format validated"

      - name: Verify WebApp Resource Group
        shell: bash
        run: |
          RG_CHECK=$(az group show --name "${{ env.WEBAPP_RESOURCE_GROUP }}" --query "{name:name}" -o json 2>/dev/null || echo "")
          [ -z "${RG_CHECK}" ] && { echo "FAIL: RG not found"; exit 1; }
          echo "OK: RG ${{ env.WEBAPP_RESOURCE_GROUP }} exists"

  # ==================================================================
  # TRABAJO 5: provision-webapp — Crear/reutilizar Web App con App Service Plan dinámico
  # ==================================================================
  provision-webapp:
    name: Provision Web App
    runs-on: ubuntu-latest
    environment: production
    needs: [validate-inputs, checkout-child, validate-infrastructure, oidc-login]
    outputs:
      app_service_url: ${{ steps.provision.outputs.app_service_url }}
      webapp_created: ${{ steps.provision.outputs.webapp_created }}
      webapp_result: ${{ steps.provision.outputs.webapp_result }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Web App (Create or Reuse)
        id: provision
        shell: bash
        run: |
          APP_NAME="${{ needs.validate-inputs.outputs.app_service_name }}"
          RG="${{ env.WEBAPP_RESOURCE_GROUP }}"
          RUNTIME="${{ env.RUNTIME }}"

          echo "=== Web App Provision ==="
          echo "App  : ${APP_NAME}"
          echo "RG   : ${RG}"

          # Usar ID completo del plan (viene del input validado, es REQUIRED)
          PLAN_ID="${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          echo "Plan ID: ${PLAN_ID}"

          EXISTING=$(az webapp show \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --query "{name:name, serverFarmId:serverFarmId}" \
            -o json 2>/dev/null || echo "")

          if [ -z "${EXISTING}" ]; then
            echo "Creating Web App..."
            az webapp create \
              --name "${APP_NAME}" \
              --resource-group "${RG}" \
              --plan "${PLAN_ID}" \
              --runtime "${RUNTIME}" \
              --output none
            echo "webapp_created=true" >> $GITHUB_ENV
            echo "Web App created successfully"
          else
            echo "Web App already exists:"
            echo "${EXISTING}"
            echo "webapp_created=false" >> $GITHUB_ENV
          fi

          # DO NOT set --startup-file: let Azure auto-detect the child's startup.sh
          # The startup.sh from the child repo handles:
          #   - pip install -r requirements.txt
          #   - Database initialization
          #   - uvicorn backend.main:app (correct module path)
          echo "Setting startup command to startup.sh..."
          az webapp config set \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --startup-file "startup.sh" \
            --output none 2>/dev/null || true
          echo "Startup command set to: startup.sh"

          RESULT=$(az webapp show \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --query "{name:name, resourceGroup:resourceGroup, serverFarmId:serverFarmId, location:location, state:state, hostNames:hostNames[0]}" \
            -o json)
          echo ""
          echo "=== Web App Status ==="
          echo "${RESULT}" | python3 -m json.tool

          WA_URL=$(echo "${RESULT}" | python3 -c "import json,sys;d=json.load(sys.stdin);print('https://'+d['hostNames'])")
          WA_FARM=$(echo "${RESULT}" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['serverFarmId'])")
          WA_STATE=$(echo "${RESULT}" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['state'])")

          EXPECTED_FARM_ID="${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          if [ "${WA_FARM}" != "${EXPECTED_FARM_ID}" ]; then
            echo "WARN: Web App not using expected plan (farm=${WA_FARM})"
            echo "Expected: ${EXPECTED_FARM_ID}"
          else
            echo "OK: Web App is using expected plan (exact match)"
          fi
          [ "${WA_STATE}" != "Running" ] && { echo "FAIL: State=${WA_STATE}"; exit 1; }

          echo "app_service_url=${WA_URL}" >> $GITHUB_OUTPUT
          echo "webapp_result=PASS" >> $GITHUB_OUTPUT
          echo "Plan: user-selected or default"

  # ==================================================================
  # TRABAJO 6: deploy — Desplegar via az webapp deploy (reemplaza Azure/webapps-deploy@v3)
  # ==================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: [validate-inputs, checkout-child, oidc-login, provision-webapp]
    outputs:
      deploy_result: ${{ steps.deploy.outputs.deploy_result }}
    steps:
      - name: Checkout Child Code (with retry)
        shell: bash
        env:
          GH_CHILD_READ_TOKEN: ${{ secrets.GH_CHILD_REPO_READ_TOKEN }}
        run: |
          REPO="${{ needs.validate-inputs.outputs.repository }}"
          SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          TARGET="child-project"
          RETRIES=5
          BACKOFF_DELAYS=(5 10 20 30 60)
          RC=1

          for i in $(seq 1 ${RETRIES}); do
            echo "--- Checkout attempt ${i}/${RETRIES} ---"
            rm -rf "${TARGET}" 2>/dev/null || true

            GIT_URL="https://x-access-token:${GH_CHILD_READ_TOKEN}@github.com/${REPO}.git"
            git clone --depth 1 "${GIT_URL}" "${TARGET}" 2>&1
            CLONE_RC=$?

            if [ ${CLONE_RC} -eq 0 ]; then
              cd "${TARGET}" || continue
              CLONED_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
              if [ "${CLONED_SHA}" = "${SHA}" ]; then
                echo "OK: Exact match — ${CLONED_SHA}"
                RC=0; break
              fi
              echo "Cloned SHA (${CLONED_SHA}) != requested (${SHA}), trying wider fetch..."

              # Strategy 1: Fetch all refs to update default branch
              git fetch origin 2>&1
              git checkout "${SHA}" 2>&1
              CHECKOUT_RC=$?
              if [ ${CHECKOUT_RC} -eq 0 ]; then
                CONFIRMED_SHA=$(git rev-parse HEAD)
                if [ "${CONFIRMED_SHA}" = "${SHA}" ]; then
                  echo "OK: Fetch all + checkout — ${CONFIRMED_SHA}"
                  RC=0; break
                fi
              fi

              # Strategy 2: Direct SHA fetch (handles "not our ref" delay)
              echo "Trying direct SHA fetch (backup)..."
              git fetch --depth 50 origin "${SHA}" 2>&1
              git checkout "${SHA}" 2>&1
              CHECKOUT_RC=$?
              if [ ${CHECKOUT_RC} -eq 0 ]; then
                CONFIRMED_SHA=$(git rev-parse HEAD)
                if [ "${CONFIRMED_SHA}" = "${SHA}" ]; then
                  echo "OK: Direct SHA fetch + checkout — ${CONFIRMED_SHA}"
                  RC=0; break
                fi
              fi
            fi

            if [ ${i} -lt ${RETRIES} ]; then
              DELAY=${BACKOFF_DELAYS[$((i-1))]}
              echo "Retry ${i} failed. Waiting ${DELAY}s..."
              sleep ${DELAY}
            fi
          done

          if [ ${RC} -ne 0 ]; then
            echo "::error::CHECKOUT_FAILED after ${RETRIES} retries — ref ${SHA} not accessible on ${REPO}"
            exit 1
          fi
          echo "deploy_checkout_result=PASS" >> $GITHUB_OUTPUT

      - name: Package deployment (zip from GITHUB_WORKSPACE root)
        shell: bash
        run: |
          echo "=== Packaging child project ==="
          ls -la child-project/
          ls -la child-project/backend/ 2>/dev/null
          cd child-project
          zip -r ../deploy.zip . -x ".git/*" -x ".gitignore"
          cd ..
          echo "Package size: $(du -sh deploy.zip | cut -f1)"
          echo "Package contents (first 40 lines):"
          unzip -l deploy.zip | head -40
          echo "File count: $(unzip -l deploy.zip | tail -1 | awk '{print $2}')"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App via AZ CLI
        id: deploy
        shell: bash
        run: |
          # Set explicit startup command BEFORE deploy so container starts with uvicorn
          echo "=== Setting startup command (pre-deploy) ==="
          az webapp config set \
            --name ${{ needs.validate-inputs.outputs.app_service_name }} \
            --resource-group ${{ env.WEBAPP_RESOURCE_GROUP }} \
            --startup-file "startup.sh" \
            --output none 2>/dev/null || true
          echo "Startup command set to: startup.sh"

          echo "=== Deploying via az webapp deploy ==="
          az webapp deploy \
            --name ${{ needs.validate-inputs.outputs.app_service_name }} \
            --resource-group ${{ env.WEBAPP_RESOURCE_GROUP }} \
            --src-path deploy.zip \
            --type zip \
            --clean true \
            --output none
          echo "=== Deployment Complete ==="
          echo "App          : ${{ needs.validate-inputs.outputs.app_service_name }}"
          echo "SHA          : ${{ needs.validate-inputs.outputs.commit_sha }}"

          # No restart needed — az webapp deploy triggers a site restart automatically
          echo "deploy_result=PASS" >> $GITHUB_OUTPUT

  # ==================================================================
  # TRABAJO 7: readiness — Consultar /health hasta que esté listo
  # ==================================================================
  readiness:
    name: Readiness Check
    runs-on: ubuntu-latest
    needs: [validate-inputs, deploy, provision-webapp]
    outputs:
      readiness_result: ${{ steps.health.outputs.readiness_result }}
      health_code: ${{ steps.health.outputs.health_code }}
    steps:
      - name: Poll /health Endpoint
        id: health
        shell: bash
        run: |
          URL="${{ needs.provision-webapp.outputs.app_service_url }}"
          MAX_ATTEMPTS=30; ATTEMPT=1
          echo "=== Readiness: ${URL}/health ==="
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            CODE=$(curl -s --connect-timeout 10 --max-time 15 \
              -o /tmp/health_response.json -w '%{http_code}' "${URL}/health" 2>/dev/null || echo "000")
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "=== Response body ==="
              cat /tmp/health_response.json 2>/dev/null || echo "(empty)"
              # Validar que es una respuesta de salud real de Hermes (no un 200 genérico)
              HERMES_STATUS=$(python3 -c "import json;d=json.load(open('/tmp/health_response.json'));print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
              echo "Health status field: ${HERMES_STATUS}"
              if [ "${HERMES_STATUS}" = "healthy" ] || [ "${HERMES_STATUS}" = "ok" ] || [ "${HERMES_STATUS}" = "saludable" ]; then
                echo "=== READY (Hermes validated) ==="
                echo "readiness_result=PASS" >> $GITHUB_OUTPUT
                echo "health_code=200" >> $GITHUB_OUTPUT
                exit 0
              else
                echo "WARN: Health endpoint returned 200 but status='${HERMES_STATUS}' (not 'healthy')"
                # Continuar consultando — podría ser un estado transitorio
              fi
            fi
            ATTEMPT=$((ATTEMPT+1))
            [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ] && sleep 10
          done
          echo "=== NOT READY ==="
          echo "readiness_result=FAIL" >> $GITHUB_OUTPUT
          echo "health_code=${CODE}" >> $GITHUB_OUTPUT
          exit 1

  # ==================================================================
  # TRABAJO 8: functional-tests — Pruebas de endpoint reales
  # ==================================================================
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [validate-inputs, deploy, provision-webapp, readiness]
    outputs:
      functional_result: ${{ steps.tests.outputs.functional_result }}
      pass_count: ${{ steps.tests.outputs.pass_count }}
      fail_count: ${{ steps.tests.outputs.fail_count }}
      root_code: ${{ steps.tests.outputs.root_code }}
      neg_code: ${{ steps.tests.outputs.neg_code }}
      health_code: ${{ steps.tests.outputs.health_code }}
      version_code: ${{ steps.tests.outputs.version_code }}
      proyecto_code: ${{ steps.tests.outputs.proyecto_code }}
      openapi_code: ${{ steps.tests.outputs.openapi_code }}
      docs_code: ${{ steps.tests.outputs.docs_code }}
    steps:
      - name: Run Functional Tests
        id: tests
        shell: bash
        run: |
          URL="${{ needs.provision-webapp.outputs.app_service_url }}"
          PASS_COUNT=0; FAIL_COUNT=0
          pass() { PASS_COUNT=$((PASS_COUNT+1)); echo "  PASS: $1"; }
          fail() { FAIL_COUNT=$((FAIL_COUNT+1)); echo "  FAIL: $1"; }
          echo "=== Functional Tests: ${URL} ==="
          echo ""

          # Prueba 1: GET /health -> 200
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /tmp/health.json -w '%{http_code}' "${URL}/health" 2>/dev/null || echo "000")
          echo "${HTTP}" > /tmp/health_code
          [ "${HTTP}" = "200" ] && pass "GET /health -> 200" || fail "GET /health -> ${HTTP}"

          # Prueba 2: GET /api/version -> 200
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /tmp/version.json -w '%{http_code}' "${URL}/api/version" 2>/dev/null || echo "000")
          echo "${HTTP}" > /tmp/version_code
          [ "${HTTP}" = "200" ] && pass "GET /api/version -> 200" || fail "GET /api/version -> ${HTTP}"

          # Prueba 3: GET / -> 200
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /tmp/root.json -w '%{http_code}' "${URL}/" 2>/dev/null || echo "000")
          [ "${HTTP}" = "200" ] && pass "GET / -> 200" || fail "GET / -> ${HTTP}"

          # Prueba 4: GET /api/proyecto -> 200
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /dev/null -w '%{http_code}' "${URL}/api/proyecto" 2>/dev/null || echo "000")
          echo "${HTTP}" > /tmp/proyecto_code
          [ "${HTTP}" = "200" ] && pass "GET /api/proyecto -> 200" || fail "GET /api/proyecto -> ${HTTP}"

          # Prueba 5: GET /openapi.json -> 200
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /tmp/openapi.json -w '%{http_code}' "${URL}/openapi.json" 2>/dev/null || echo "000")
          echo "${HTTP}" > /tmp/openapi_code
          [ "${HTTP}" = "200" ] && pass "GET /openapi.json -> 200" || fail "GET /openapi.json -> ${HTTP}"

          # Prueba 6: GET /swagger -> 200 (FastAPI docs_url configurado a /swagger por Factory)
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /dev/null -w '%{http_code}' "${URL}/swagger" 2>/dev/null || echo "000")
          echo "${HTTP}" > /tmp/docs_code
          [ "${HTTP}" = "200" ] && pass "GET /swagger -> 200" || fail "GET /swagger -> ${HTTP}"

          # Prueba 7: NEGATIVA - 404
          HTTP=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /dev/null -w '%{http_code}' "${URL}/ruta-que-no-existe" 2>/dev/null || echo "000")
          [ "${HTTP}" = "404" ] && pass "NEGATIVE 404 -> ${HTTP}" || fail "NEGATIVE 404 -> ${HTTP}"

          # Prueba 8: Identidad — validar coherencia con el project_name del Factory
          PROJECT_NAME="${{ needs.validate-inputs.outputs.project_name }}"
          HEALTH_PROY=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('proyecto',''))" 2>/dev/null)
          VERSION_PROY=$(python3 -c "import json;print(json.load(open('/tmp/version.json')).get('proyecto',''))" 2>/dev/null)
          OPENAPI_TITLE=$(python3 -c "import json;print(json.load(open('/tmp/openapi.json')).get('info',{}).get('title',''))" 2>/dev/null)
          echo "  Project: ${PROJECT_NAME}  Version.proyecto: ${VERSION_PROY}  OpenAPI.title: ${OPENAPI_TITLE}  Health.proyecto: ${HEALTH_PROY}"
          if [ "${VERSION_PROY}" = "${PROJECT_NAME}" ] && [ "${OPENAPI_TITLE}" = "${PROJECT_NAME}" ]; then
            pass "Identity confirmed (${PROJECT_NAME})"
          else
            fail "Identity MISMATCH: esperado=${PROJECT_NAME}, version.proyecto=${VERSION_PROY}, openapi.title=${OPENAPI_TITLE}"
          fi

          echo ""
          echo "=== RESULTS: ${PASS_COUNT} pass, ${FAIL_COUNT} fail ==="
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/" 2>/dev/null || echo "000")
          NEG_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/ruta-que-no-existe" 2>/dev/null || echo "000")
          echo "pass_count=${PASS_COUNT}" >> $GITHUB_OUTPUT
          echo "fail_count=${FAIL_COUNT}" >> $GITHUB_OUTPUT
          echo "root_code=${ROOT_CODE}" >> $GITHUB_OUTPUT
          echo "neg_code=${NEG_CODE}" >> $GITHUB_OUTPUT
          echo "health_code=$(cat /tmp/health_code 2>/dev/null || echo '000')" >> $GITHUB_OUTPUT
          echo "version_code=$(cat /tmp/version_code 2>/dev/null || echo '000')" >> $GITHUB_OUTPUT
          echo "proyecto_code=$(cat /tmp/proyecto_code 2>/dev/null || echo '000')" >> $GITHUB_OUTPUT
          echo "openapi_code=$(cat /tmp/openapi_code 2>/dev/null || echo '000')" >> $GITHUB_OUTPUT
          echo "docs_code=$(cat /tmp/docs_code 2>/dev/null || echo '000')" >> $GITHUB_OUTPUT
          if [ "${FAIL_COUNT}" -gt 0 ]; then
            echo "functional_result=FAIL" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "functional_result=PASS" >> $GITHUB_OUTPUT

  # ==================================================================
  # TRABAJO 9: user-facing-validation — Validar aplicación User-Facing
  # ==================================================================
  user-facing-validation:
    name: User-Facing Validation
    runs-on: ubuntu-latest
    needs: [validate-inputs, deploy, provision-webapp, functional-tests]
    outputs:
      user_facing_result: ${{ steps.validate.outputs.user_facing_result }}
      status_code: ${{ steps.validate.outputs.status_code }}
      content_type: ${{ steps.validate.outputs.content_type }}
      html_size: ${{ steps.validate.outputs.html_size }}
      html_not_empty: ${{ steps.validate.outputs.html_not_empty }}
      identity_match: ${{ steps.validate.outputs.identity_match }}
      error_page_detected: ${{ steps.validate.outputs.error_page_detected }}
      url: ${{ steps.validate.outputs.url }}
    steps:
      # FIX (FASE 1): Checkout HERMES-ENTERPRISE (Control Plane) to access tools/validate_user_facing.py
      # The tool belongs to the Control Plane, NOT to the child repo.
      - name: Checkout HERMES-ENTERPRISE (Control Plane)
        uses: actions/checkout@v7
        with:
          path: control-plane
          fetch-depth: 1

      - name: Validate User-Facing Page
        id: validate
        shell: bash
        run: |
          URL="${{ needs.provision-webapp.outputs.app_service_url }}"
          PROJ="${{ needs.validate-inputs.outputs.project_name }}"

          echo "=== User-Facing Validation ==="
          echo "URL: ${URL}/"
          echo "Expected Project: ${PROJ}"
          echo ""

          # Fetch the page
          HTTP_CODE=$(curl -s --connect-timeout 10 --max-time 15 \
            -o /tmp/user-facing.html -w '%{http_code}' "${URL}/" 2>/dev/null || echo "000")
          echo "status_code=${HTTP_CODE}" >> $GITHUB_OUTPUT

          # Run Python-based validation from Control Plane checkout path (OPTION B)
          # The validator lives in HERMES-ENTERPRISE/tools/, accessed via control-plane/tools/
          python control-plane/tools/validate_user_facing.py --html-file /tmp/user-facing.html "${PROJ}" 2>&1 | tee /tmp/validation-result.json
          VALID_EXIT=$?

          # Parse JSON result for GITHUB_OUTPUT
          echo "content_type=$(python -c "import json; print(json.load(open('/tmp/validation-result.json'))['details'].get('content_type','unknown'))")" >> $GITHUB_OUTPUT
          echo "html_size=$(python -c "import json; print(json.load(open('/tmp/validation-result.json'))['details'].get('html_size',0))")" >> $GITHUB_OUTPUT
          echo "error_page_detected=$(python -c "import json; print(json.load(open('/tmp/validation-result.json'))['result']=='FAIL' and any(m['type'] in ('error_title','structural_error','safe_error_pattern','http_status') for m in json.load(open('/tmp/validation-result.json'))['error_matches']))" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "identity_match=$(python -c "import json; print(json.load(open('/tmp/validation-result.json'))['details'].get('identity_found',False))" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "url=${URL}/" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Validation result: $(python -c "import json; print(json.load(open('/tmp/validation-result.json'))['result'], json.load(open('/tmp/validation-result.json'))['reason'])") ==="
          if [ "${VALID_EXIT}" -ne 0 ]; then
            echo "user_facing_result=FAIL" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "user_facing_result=PASS" >> $GITHUB_OUTPUT

  # ==================================================================
  # TRABAJO 10: evidence — Generar deployment-report.json (resultados reales)
  # ==================================================================
  evidence:
    name: Generate Evidence
    runs-on: ubuntu-latest
    needs:
      - validate-inputs
      - checkout-child
      - validate-infrastructure
      - oidc-login
      - provision-webapp
      - deploy
      - readiness
      - functional-tests
      - user-facing-validation
    outputs:
      test_result: ${{ steps.final.outputs.test_result }}
    steps:
      - name: Checkout HERMES-ENTERPRISE (for evidence script)
        uses: actions/checkout@v7
        with:
          path: control-plane
          fetch-depth: 1

      - name: Generate Evidence
        id: evidence-gen
        shell: bash
        run: |
          export URL="${{ needs.provision-webapp.outputs.app_service_url }}"
          export PROJ="${{ needs.validate-inputs.outputs.project_name }}"
          export REPO="${{ needs.validate-inputs.outputs.repository }}"
          export SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          export VERIFIED_SHA="${{ needs.checkout-child.outputs.deployed_sha }}"
          export APP_NAME="${{ needs.validate-inputs.outputs.app_service_name }}"
          export WEBAPP_RG="${{ env.WEBAPP_RESOURCE_GROUP }}"
          export PLAN_RESOURCE_ID="${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          export LOCATION="${{ env.LOCATION }}"
          export RUNTIME="${{ env.RUNTIME }}"
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_WORKFLOW="${{ github.workflow }}"
          export TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export OIDC_RESULT="${{ needs.oidc-login.outputs.login_result }}"
          export DEPLOY_RESULT="${{ needs.deploy.outputs.deploy_result }}"
          export READINESS_RESULT="${{ needs.readiness.outputs.readiness_result }}"
          export FUNC_RESULT="${{ needs.functional-tests.outputs.functional_result }}"
          export USER_FACING_RESULT="${{ needs.user-facing-validation.outputs.user_facing_result }}"
          export UF_CONTENT_TYPE="${{ needs.user-facing-validation.outputs.content_type }}"
          export UF_HTML_SIZE="${{ needs.user-facing-validation.outputs.html_size }}"
          export UF_HTML_NOT_EMPTY="${{ needs.user-facing-validation.outputs.html_not_empty }}"
          export UF_IDENTITY_MATCH="${{ needs.user-facing-validation.outputs.identity_match }}"
          export UF_ERROR_PAGE="${{ needs.user-facing-validation.outputs.error_page_detected }}"

          python3 control-plane/tools/generate_child_evidence.py > deployment-report.json 2>&1
          echo "=== Evidence Generated ==="
          cat deployment-report.json

      - name: Register Implementation Steps
        shell: bash
        run: |
          URL="${{ needs.provision-webapp.outputs.app_service_url }}"
          PORTAL_URL="https://as-hermesportal.azurewebsites.net"
          DID="${{ needs.validate-inputs.outputs.deployment_id }}"
          PROJ="${{ needs.validate-inputs.outputs.project_name }}"
          REPO="${{ needs.validate-inputs.outputs.repository }}"
          SHA="${{ needs.validate-inputs.outputs.commit_sha }}"
          VERIFIED_SHA="${{ needs.checkout-child.outputs.deployed_sha }}"

          # Helper function — register paso in Portal (with error capture)
          register_paso() {
            local NUM=$1 NAME=$2 ESTADO=$3 DETALLE=$4 RESULT=$5
            local RESPONSE HTTP_CODE
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${PORTAL_URL}/api/fabrica/proyectos/${DID}/paso" \
              -H "Content-Type: application/json" \
              -d "{\"numero_paso\":${NUM},\"estado_paso\":\"${ESTADO}\",\"detalle\":\"${DETALLE}\",\"evidencia\":\"${RESULT}\"}" 2>&1)
            HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
            BODY=$(echo "${RESPONSE}" | sed '$d')
            if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
              echo "  OK: Paso ${NUM} ${NAME} -> ${ESTADO} (HTTP ${HTTP_CODE})"
            else
              echo "  ERROR: Paso ${NUM} ${NAME} -> HTTP ${HTTP_CODE}, body: ${BODY}"
            fi
          }

          # Registrar CI Child (paso 4)
          register_paso 4 "CI CHILD" "COMPLETADO" "CI ejecutado en repositorio Child" "PASS"

          # Registrar Control Plane (paso 5)
          register_paso 5 "CONTROL PLANE" "COMPLETADO" "Parametros validados y checkout completado" "PASS"

          # Registrar OIDC (paso 6)
          OIDC_RES="${{ needs.oidc-login.outputs.login_result }}"
          register_paso 6 "AUTENTICACIÓN" "${OIDC_RES}" "GitHub OIDC -> Azure login" "${OIDC_RES}"

          # Registrar Azure (paso 7)
          ASP_ID="${{ needs.validate-inputs.outputs.app_service_plan_id }}"
          register_paso 7 "AZURE" "COMPLETADO" "WebApp aprovisionada en plan: ${ASP_ID}" "PASS"

          # Registrar Deploy (paso 8)
          DEP_RES="${{ needs.deploy.outputs.deploy_result }}"
          register_paso 8 "DEPLOY" "${DEP_RES}" "ZIP Deploy a Azure WebApp" "${DEP_RES}"

          # Registrar Readiness (paso 9)
          RDY_RES="${{ needs.readiness.outputs.readiness_result }}"
          register_paso 9 "READINESS" "${RDY_RES}" "Health endpoint verificado" "${RDY_RES}"

          # Registrar Pruebas Funcionales (paso 10)
          FUNC_RES="${{ needs.functional-tests.outputs.functional_result }}"
          register_paso 10 "PRUEBAS FUNCIONALES" "${FUNC_RES}" "Endpoints HTTP verificados" "${FUNC_RES}"

          # Registrar Evidencia (paso 11)
          register_paso 11 "EVIDENCIA" "COMPLETADO" "deployment-report.json generado" "PASS"

          # Step 12: PUBLICACION
          register_paso 12 "PUBLICACIÓN" "COMPLETADO" "WebApp publicada" "PASS"
          # Step 13: NAVEGADOR
          UF_RESULT="${{ needs.user-facing-validation.outputs.user_facing_result }}"
          UF_ESTADO="COMPLETADO"
          if [ "${UF_RESULT}" != "PASS" ]; then UF_ESTADO="FALLIDO"; fi
          register_paso 13 "NAVEGADOR" "${UF_ESTADO}" "Validacion navegador: ${UF_RESULT}" "${UF_RESULT}"

          # Finalizar implementacion — call Portal finalizar (with error capture)
          FINAL_STATUS="COMPLETADO"
          FINAL_RESULT="PASS"
          if [ "${OIDC_RES}" = "FAIL" ] || [ "${DEP_RES}" = "FAIL" ] || [ "${RDY_RES}" = "FAIL" ] || [ "${FUNC_RES}" = "FAIL" ]; then
            FINAL_STATUS="FALLIDO"
            FINAL_RESULT="FAIL"
          fi
          FINAL_RESP=$(curl -s -w "\n%{http_code}" -X POST "${PORTAL_URL}/api/fabrica/proyectos/${DID}/finalizar" \
            -H "Content-Type: application/json" \
            -d "{\"resultado\":\"${FINAL_RESULT}\",\"error\":\"\"}" 2>&1)
          FINAL_HTTP=$(echo "${FINAL_RESP}" | tail -1)
          FINAL_BODY=$(echo "${FINAL_RESP}" | sed '$d')
          if [ "${FINAL_HTTP}" -ge 200 ] && [ "${FINAL_HTTP}" -lt 300 ]; then
            echo "  OK: Portal proyecto finalizado: ${FINAL_STATUS} (HTTP ${FINAL_HTTP})"
          else
            echo "  ERROR: Portal finalizar fallo — HTTP ${FINAL_HTTP}, body: ${FINAL_BODY}"
          fi

          # --- METADATA: Actualizar Portal Hermes con trazabilidad ---
          PORTAL_URL="https://as-hermesportal.azurewebsites.net"
          DID="${{ needs.validate-inputs.outputs.deployment_id }}"
          DEP_RES="${{ needs.deploy.outputs.deploy_result }}"
          RDY_RES="${{ needs.readiness.outputs.readiness_result }}"
          FUNC_RES="${{ needs.functional-tests.outputs.functional_result }}"
          UF_RES="${{ needs.user-facing-validation.outputs.validation_result }}"
          CP_METADATA=$(printf '{"control_plane_run_id":"%s","control_plane_run_url":"%s","control_plane_status":"%s","commit_sha":"%s","web_app_url":"%s","deploy_result":"%s","readiness_result":"%s","functional_result":"%s","user_facing_result":"%s","sha_chain_result":"%s","checkout_sha":"%s","control_plane_finished_at":"%s"}' \
             "${{ github.run_id }}" \
             "https://github.com/FREDYASARMIENTOT/HERMES-ENTERPRISE/actions/runs/${{ github.run_id }}" \
             "${FINAL_STATUS}" \
             "${SHA}" \
             "${URL}" \
             "${DEP_RES}" \
             "${RDY_RES}" \
             "${FUNC_RES}" \
             "${UF_RES}" \
             "${{ needs.checkout-child.outputs.sha_chain }}" \
             "${{ needs.checkout-child.outputs.deployed_sha }}" \
             "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          METADATA_RESP=$(curl -s -w "\n%{http_code}" -X PUT "${PORTAL_URL}/api/fabrica/proyectos/${DID}/metadata" \
            -H "Content-Type: application/json" \
            -d "${CP_METADATA}" 2>&1)
          METADATA_HTTP=$(echo "${METADATA_RESP}" | tail -1)
          METADATA_BODY=$(echo "${METADATA_RESP}" | sed '$d')
          if [ "${METADATA_HTTP}" -ge 200 ] && [ "${METADATA_HTTP}" -lt 300 ]; then
            echo "  OK: Portal metadata updated (control-plane) — HTTP ${METADATA_HTTP}"
          else
            echo "  ERROR: Portal metadata update failed — HTTP ${METADATA_HTTP}, body: ${METADATA_BODY}"
          fi

          echo "=== Registry Steps Registered ==="

      - name: Upload Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ needs.validate-inputs.outputs.project_name }}-${{ github.run_id }}
          path: deployment-report.json
          if-no-files-found: warn

      - name: Final Result
        id: final
        if: always()
        shell: bash
        run: |
          RESULT=$(python3 -c "import json;print(json.load(open('deployment-report.json')).get('result','FAIL'))" 2>/dev/null || echo "FAIL")
          echo "test_result=${RESULT}" >> $GITHUB_OUTPUT
          if [ "${RESULT}" = "PASS" ]; then
            echo ""
            echo "=========================================="
            echo "  CONTROL PLANE DEPLOYMENT: PASS"
            echo "=========================================="
            echo "  Project    : ${{ needs.validate-inputs.outputs.project_name }}"
            echo "  Repository : ${{ needs.validate-inputs.outputs.repository }}"
            echo "  SHA        : ${{ needs.validate-inputs.outputs.commit_sha }}"
            echo "  Web App    : ${{ needs.provision-webapp.outputs.app_service_url }}"
            echo "  Plan ResID : ${{ needs.validate-inputs.outputs.app_service_plan_id }}"
            echo "  WebApp RG  : ${{ env.WEBAPP_RESOURCE_GROUP }}"
            echo "  OIDC       : PASS (FIC reutilizada)"
            echo "=========================================="
          else
            echo ""
            echo "=========================================="
            echo "  CONTROL PLANE DEPLOYMENT: FAIL"
            echo "=========================================="
            exit 1
          fi
