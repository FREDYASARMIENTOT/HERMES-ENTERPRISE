# ====================================================================
# Deploy Pipeline — Hermes Enterprise Project Factory
# ====================================================================
# RC77: Four-stage pipeline for project validation and deployment.
# Validate → Build → Deploy → SmokeTest
# ====================================================================

name: Hermes CI/CD Pipeline

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Project name to deploy (default: hermesenterprise)'
        required: false
        default: 'hermesenterprise'
        type: string
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'auto'
        type: string

env:
  PROJECT_NAME: ${{ inputs.projectName || 'hermesenterprise' }}
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate project structure
        run: |
          echo "Project: ${PROJECT_NAME}"
          echo "CorrelationId: ${CORRELATION_ID}"
          test -f config/Hermes.Azure.json && echo "OK: Azure config"
          test -f config/Hermes.Python.json && echo "OK: Python config"
          echo "Validation complete"
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Validate Python imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: as-${{ env.PROJECT_NAME }}
          slot-name: production
          package: .
          clean: true

      - name: Record deployment artifact
        run: |
          echo "DEPLOY_CORRELATION_ID=${{ env.CORRELATION_ID }}" >> $GITHUB_ENV
          echo "DEPLOY_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "DEPLOY_SHA=${{ github.sha }}" >> $GITHUB_ENV

  smoketest:
    name: Smoke Test
    if: success() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for deployment
        run: sleep 30

      - name: Test endpoints
        run: |
          URL="https://as-${PROJECT_NAME}.azurewebsites.net"
          CORR_ID="${CORRELATION_ID}"
          ENDPOINTS=("/health" "/api/version" "/api/proyecto" "/")
          ALL_PASS=true
          for EP in "${ENDPOINTS[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$EP")
            if [ "$CODE" -eq 200 ]; then
              echo "PASS: $EP -> $CODE ($CORR_ID)"
            else
              echo "FAIL: $EP -> $CODE ($CORR_ID)"
              ALL_PASS=false
            fi
          done
          if [ "$ALL_PASS" = false ]; then exit 1; fi
          echo "All smoke tests passed (CorrelationId: $CORR_ID)"
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

      - name: Check middleware headers
        run: |
          URL="https://as-${PROJECT_NAME}.azurewebsites.net"
          echo "=== Checking middleware headers ==="
          curl -sI "$URL/health" | head -20
          echo "=== Correlation ID middleware [expecting X-Correlation-ID] ==="
          CORR_HEADER=$(curl -sI "$URL/health" 2>&1 | grep -i "x-correlation-id" || echo "MISSING")
          echo "Correlation header: $CORR_HEADER"
          if echo "$CORR_HEADER" | grep -qi "x-correlation-id"; then
            echo "PASS: Correlation ID middleware active"
          else
            echo "FAIL: Correlation ID middleware not detected (non-blocking)"
          fi
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
