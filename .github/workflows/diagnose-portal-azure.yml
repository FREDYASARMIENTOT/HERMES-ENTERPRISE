# ====================================================================
# DIAGNOSE PORTAL AZURE — Workflow temporal de diagnóstico
# ====================================================================
# Propósito: Obtener evidencia del runtime de AS-HermesPortal
#             usando el mismo mecanismo OIDC del despliegue productivo.
# ====================================================================
# NO modifica:
#   - main.py, startup.sh, requirements.txt
#   - portal-ci-cd.yml, OIDC, FIC, RBAC
#   - AS-HermesEnterprise, ASP-IAUR, proyectos hijos
# ====================================================================
# Trigger: SOLO workflow_dispatch (manual)
# ====================================================================

name: Diagnose Portal Azure

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'diagnose'
        type: string

env:
  APP_NAME: as-hermesportal
  RESOURCE_GROUP: RG-Hermes-Proyectos
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  diagnose:
    name: Diagnose Azure Runtime
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "[1/7] Verify OIDC Auth"
        run: |
          echo "=== Azure Authentication ==="
          az account show --query "{name:name,id:id,tenantId:tenantId,user:user.name}" -o json
          echo "OK: OIDC authentication successful"

      - name: "[2/7] App Service State"
        run: |
          echo "=== App Service Show ==="
          az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{state:state,defaultHostName:defaultHostName,serverFarmId:serverFarmId,kind:kind,linuxFxVersion:siteConfig.linuxFxVersion,appCommandLine:siteConfig.appCommandLine}" \
            -o json

          echo ""
          echo "=== App Service Config ==="
          az webapp config show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{linuxFxVersion:linuxFxVersion,appCommandLine:appCommandLine,alwaysOn:alwaysOn,pythonVersion:pythonVersion}" \
            -o json

      - name: "[3/7] App Settings (SCM_DO_BUILD only)"
        run: |
          echo "=== App Settings: SCM_DO_BUILD_DURING_DEPLOYMENT ==="
          az webapp config appsettings list \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT']" \
            -o json

      - name: "[4/7] Deployment List"
        run: |
          echo "=== Deployment List (last 5) ==="
          az webapp deployment list \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0:5].{id:id,status:status,author:author,deployer:deployer,endTime:endTime,active:active}" \
            -o json 2>&1 || echo "COMMAND NOT AVAILABLE in this CLI version"

      - name: "[5/7] Deployment Log"
        run: |
          echo "=== Deployment Log ==="
          az webapp log deployment show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            -o json 2>&1 || echo "COMMAND NOT AVAILABLE in this CLI version"

      - name: "[6/7] Startup Log (PRIORITY)"
        continue-on-error: true
        run: |
          echo "=== Startup Log ==="
          az webapp log startup show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            2>&1 || echo "COMMAND NOT AVAILABLE in this CLI version"

      - name: "[7/7] HTTP Health Check"
        run: |
          echo "=== HTTP Health Check ==="
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "Testing: ${URL}/health"
          HTTP_CODE=$(curl -s --connect-timeout 15 --max-time 20 -o /tmp/health_response.txt -w "%{http_code}" "${URL}/health" 2>/dev/null || echo "000")
          echo "HTTP Status: ${HTTP_CODE}"
          if [ -f /tmp/health_response.txt ]; then
            echo "--- Response ---"
            cat /tmp/health_response.txt | head -100
            echo "---"
          fi
          echo ""
          echo "Testing: ${URL}/"
          HTTP_CODE_ROOT=$(curl -s --connect-timeout 15 --max-time 20 -o /tmp/root_response.txt -w "%{http_code}" "${URL}/" 2>/dev/null || echo "000")
          echo "HTTP Status: ${HTTP_CODE_ROOT}"
          if [ -f /tmp/root_response.txt ]; then
            echo "--- Response (first 200 chars) ---"
            head -c 200 /tmp/root_response.txt
            echo ""
            echo "---"
          fi

      - name: "[8/9] STOP App Service (Controlled Recovery)"
        run: |
          echo "=== STOP App Service ==="
          echo "Current state before stop:"
          az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{state:state}" -o json
          
          echo ""
          echo "Executing: az webapp stop..."
          az webapp stop \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            2>&1
          
          echo "Verifying state after stop:"
          az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{state:state}" -o json
          
          # Verify it's really stopped before proceeding
          STATE=$(az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "state" -o tsv 2>/dev/null || echo "unknown")
          if [ "$STATE" != "Stopped" ]; then
            echo "WARNING: State after stop = ${STATE}, expected 'Stopped'"
            echo "Waiting 10s more..."
            sleep 10
          fi
          echo "STOP complete"

      - name: "[8a/9] Wait after STOP (30s)"
        run: |
          echo "=== Waiting 30 seconds after STOP ==="
          sleep 30
          echo "Resume in 30 seconds done"

      - name: "[8b/9] START App Service"
        run: |
          echo "=== START App Service ==="
          az webapp start \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            2>&1
          
          echo ""
          echo "Verifying state after start:"
          az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{state:state}" -o json
          
          echo "START complete. Container will begin booting..."

      - name: "[8c/9] Wait for container warmup (60s)"
        run: |
          echo "=== Waiting 60 seconds for container to start === "
          # Wait with progressive checks
          for i in $(seq 1 6); do
            sleep 10
            STATE=$(az webapp show \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "state" -o tsv 2>/dev/null || echo "unknown")
            echo "  Check $i: state = $STATE"
            
            URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
            HTTP_CODE=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "${URL}" 2>/dev/null || echo "000")
            echo "  Check $i: /health = $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  Site is UP! (HTTP 200)"
              break
            fi
          done
          echo "Container warmup wait complete"

      - name: "[9/9] POST-RECOVERY Capture Docker & App Logs"
        continue-on-error: true
        run: |
          echo "=== POST-RECOVERY capture container logs ==="
          echo "--- step 1: Enable filesystem logging ---"
          az webapp log config \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --application-logging filesystem \
            --level verbose \
            --docker-container-logging filesystem \
            2>&1 || echo "Log config not available"

          echo "--- step 2: Download logs as ZIP ---"
          LOG_DIR="/tmp/applogs_${{ env.CORRELATION_ID }}"
          mkdir -p "$LOG_DIR"
          ZIP_PATH="$LOG_DIR/logs.zip"
          az webapp log download \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --log-file "$ZIP_PATH" \
            2>&1 || echo "Log download not available"

          if [ -f "$ZIP_PATH" ]; then
            echo "--- step 3: Extract and search for Python errors ---"
            unzip -o "$ZIP_PATH" -d "$LOG_DIR" 2>/dev/null
            echo "=== Files found ==="
            find "$LOG_DIR" -type f | head -30
            
            echo "=== Searching for Python errors in logs ==="
            grep -ri "traceback\|moduleNotFound\|ImportError\|Error\|Exception\|uvicorn\|os error" "$LOG_DIR" 2>/dev/null | head -60 || echo "No matches found"
            
            echo "=== Docker log files ==="
            find "$LOG_DIR" -path "*docker*" -o -path "*app*" | head -20
            
            echo "=== Last 80 lines of all log files ==="
            find "$LOG_DIR" -type f -name "*.log" -o -name "*.txt" | while read f; do
              echo "---- File: $f ----"
              tail -30 "$f" 2>/dev/null
            done | head -200
            
            echo "=== Full stdout/stderr logs ==="
            find "$LOG_DIR" -name "stdout*" -o -name "stderr*" -o -name "default_docker*" | while read f; do
              echo "---- File: $f ----"
              cat "$f" 2>/dev/null | tail -80
            done | head -200
          else
            echo "WARNING: Log download produced no ZIP file"
            echo "--- Attempting to read logs directly via az webapp log tail (10s) ---"
            timeout 10 az webapp log tail \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              2>&1 || echo "Log tail not available"
          fi

      - name: "[9a/9] POST-RECOVERY HTTP Health Check"
        run: |
          echo "=== POST-RECOVERY HTTP Health Check ==="
          URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          
          echo "Testing: ${URL}/health"
          HTTP_CODE=$(curl -s --connect-timeout 15 --max-time 20 -o /tmp/health_post.txt -w "%{http_code}" "${URL}/health" 2>/dev/null || echo "000")
          echo "HTTP Status: ${HTTP_CODE}"
          if [ -f /tmp/health_post.txt ]; then
            echo "--- Response ---"
            cat /tmp/health_post.txt | head -100
            echo "---"
          fi
          
          echo ""
          echo "Testing: ${URL}/"
          HTTP_CODE_ROOT=$(curl -s --connect-timeout 15 --max-time 20 -o /tmp/root_post.txt -w "%{http_code}" "${URL}/" 2>/dev/null || echo "000")
          echo "HTTP Status: ${HTTP_CODE_ROOT}"
          if [ -f /tmp/root_post.txt ]; then
            echo "--- Response (first 200 chars) ---"
            head -c 200 /tmp/root_post.txt
            echo ""
            echo "---"
          fi
          
          echo ""
          echo "=== Final App Service State ==="
          az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{state:state,linuxFxVersion:siteConfig.linuxFxVersion,appCommandLine:siteConfig.appCommandLine}" \
            -o json

      - name: Summary
        if: always()
        run: |
          echo "========================================"
          echo "DIAGNOSIS COMPLETE — ${{ env.CORRELATION_ID }}"
          echo "========================================"
          echo "Review all outputs above for evidence."
          echo "Recovery STOP/START was executed."
          echo "Startup logs and health check post-recovery"
          echo "are available above."
          echo "No production code was modified."
          echo "No deployment was triggered."
          echo "========================================"