# ====================================================================
# deploy-portal.yml — Despliega el Portal Hermes en AS-HermesPortal
# ====================================================================
# RC88: Workflow ligero para deploy del Portal Operacional
# Usa azure/webapps-deploy@v3 (diferente mecanismo que az webapp deploy)
# ====================================================================

name: Deploy Portal Hermes

on:
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Project name'
        required: false
        default: 'hermesportal'
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: ${{ inputs.projectName || 'hermesportal' }}
  RG: RG-Hermes-Proyectos
  APP_NAME: as-hermesportal

jobs:
  deploy-portal:
    name: Deploy Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: .
          startup-command: 'Hermes.Web/deployment/startup.sh'
          resource-group: ${{ env.RG }}