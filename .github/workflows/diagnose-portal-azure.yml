# diagnose-portal-azure.yml
name: Diagnose Portal Azure
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción'
        required: true
        default: 'enable-mi'
        type: choice
        options:
          - enable-mi
          - diagnose
          - assign-reader
permissions:
  contents: read
  id-token: write
env:
  APP_NAME: as-hermesportal
  RESOURCE_GROUP: RG-Hermes-Proyectos
jobs:
  manage:
    name: Manage Portal Azure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Diagnose
        if: ${{ inputs.action == 'diagnose' || inputs.action == 'enable-mi' }}
        shell: bash
        run: |
          echo "=== Current Identity ==="
          az webapp identity show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || echo "NO_MI"
          echo "=== App Service Plans ==="
          az resource list --resource-group ${{ env.RESOURCE_GROUP }} --resource-type Microsoft.Web/serverfarms --query "[].{name:name, id:id, sku:sku.tier}" -o table 2>/dev/null
      - name: Enable MI
        if: ${{ inputs.action == 'enable-mi' }}
        shell: bash
        run: |
          az webapp identity assign --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}
      - name: Assign Reader
        if: ${{ inputs.action == 'enable-mi' || inputs.action == 'assign-reader' }}
        shell: bash
        run: |
          MI=$(az webapp identity show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query principalId -o tsv)
          if [ -n "$MI" ]; then
            az role assignment create --assignee "$MI" --role Reader --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}" --output none
            echo "Reader assigned to MI at RG scope"
          else
            echo "No MI found"
          fi
      - name: Verify
        if: ${{ always() }}
        shell: bash
        run: |
          az webapp identity show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null && echo "MI: OK" || echo "MI: NO"
