# ====================================================================
# Deploy Pipeline — Hermes Enterprise Project Factory
# ====================================================================
# RC77: Four-stage pipeline for project validation and deployment.
# Validate → Build → Deploy → SmokeTest
# ====================================================================

name: Hermes CI/CD Pipeline

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Project name to deploy (default: hermesenterprise)'
        required: false
        default: 'hermesenterprise'
        type: string
      correlationId:
        description: 'Correlation ID for tracking'
        required: false
        default: 'auto'
        type: string

env:
  PROJECT_NAME: ${{ inputs.projectName || 'hermesenterprise' }}
  CORRELATION_ID: ${{ inputs.correlationId || github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate project structure
        run: |
          echo "Project: ${PROJECT_NAME}"
          echo "CorrelationId: ${CORRELATION_ID}"
          test -f config/Hermes.Azure.json && echo "OK: Azure config"
          test -f config/Hermes.Python.json && echo "OK: Python config"
          echo "Validation complete"
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1

      - name: Validate Python imports
        run: |
          python -c "
          import fastapi; print(f'FastAPI: {fastapi.__version__}')
          import uvicorn; print(f'Uvicorn: {uvicorn.__version__}')
          import jinja2; print(f'Jinja2: {jinja2.__version__}')
          print('All dependencies OK')
          "

      - name: Validate Hermes.Web entrypoint
        run: |
          python -c "
          from Hermes.Web.backend.main import app
          print(f'FastAPI app: {app.title}')
          print(f'Routes: {len(app.routes)}')
          assert 'Hermes' in app.title, f'Identity mismatch: {app.title}'
          print('Entrypoint Hermes.Web.backend.main:app validated')
          " 2>&1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: as-${{ env.PROJECT_NAME }}
          slot-name: production
          package: .
          clean: true
          startup-command: 'gunicorn --bind=0.0.0.0:8000 --timeout 600 --worker-class uvicorn.workers.UvicornWorker Hermes.Web.backend.main:app'

      - name: Record deployment artifact
        run: |
          echo "DEPLOY_CORRELATION_ID=${{ env.CORRELATION_ID }}" >> $GITHUB_ENV
          echo "DEPLOY_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "DEPLOY_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Validate Azure startup command
        shell: bash
        run: |
          APP_NAME="as-${{ env.PROJECT_NAME }}"
          RG="RG-Hermes-Proyectos"
          ACTUAL=$(az webapp config show --name "${APP_NAME}" --resource-group "${RG}" --query "appCommandLine" -o tsv 2>&1)
          EXPECTED='gunicorn --bind=0.0.0.0:8000 --timeout 600 --worker-class uvicorn.workers.UvicornWorker Hermes.Web.backend.main:app'
          echo "Expected: ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          if [ "${ACTUAL}" = "${EXPECTED}" ]; then
            echo "✅ Startup command MATCH (gunicorn+uvicorn, --timeout 600)"
          else
            echo "⚠️  Startup command MISMATCH"
            echo "Applying correct startup command..."
            az webapp config set \
              --name "${APP_NAME}" \
              --resource-group "${RG}" \
              --startup-file "${EXPECTED}" \
              --output none
            echo "✅ Startup command corrected"
          fi

  smoketest:
    name: Smoke Test
    if: success() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for App Service readiness (polling)
        run: |
          URL="https://as-${PROJECT_NAME}.azurewebsites.net"
          echo "Polling ${URL} for readiness..."
          MAX_ATTEMPTS=30
          ATTEMPT=1
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Checking ${URL}/health ..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "App Service is READY (HTTP 200)"
              curl -s "${URL}/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  app={d.get(\"aplicacion\",\"?\")}, estado={d.get(\"estado\",\"?\")}')" 2>/dev/null || true
              break
            fi
            echo "  HTTP ${HTTP_CODE} — waiting 10s..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ ${ATTEMPT} -gt ${MAX_ATTEMPTS} ]; then
            echo "FAIL: App Service not ready after 5 minutes"
            echo "Last HTTP code: ${HTTP_CODE}"
            exit 1
          fi
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

      - name: Smoke Test — RC77-C4 Adversarial E2E Validation
        run: |
          # Redirect all output to log file for artifact capture
          SMOKE_LOG="${RUNNER_TEMP}/smoke-test-${CORRELATION_ID}.log"
          exec 5>&1
          exec > >(tee -a "${SMOKE_LOG}") 2>&1

          URL="https://as-${PROJECT_NAME}.azurewebsites.net"
          CORR_ID="${CORRELATION_ID}"
          ALL_PASS=true
          FAIL_COUNT=0
          PASS_COUNT=0

          fail() {
            FAIL_COUNT=$((FAIL_COUNT + 1))
            ALL_PASS=false
            echo "FAIL: $1"
          }

          pass() {
            PASS_COUNT=$((PASS_COUNT + 1))
            echo "PASS: $1"
          }

          echo "=========================================="
          echo "  RC77-C4 — Adversarial E2E Smoke Test"
          echo "  CorrelationId: $CORR_ID"
          echo "  URL: $URL"
          echo "=========================================="

          # ── Test 1: HTTP Status Codes ──
          echo "--- [1/6] HTTP Status Codes ---"
          for EP in "/health" "/api/version" "/api/proyecto" "/" "/openapi.json"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$EP")
            if [ "$CODE" -eq 200 ]; then
              pass "GET $EP -> 200"
            else
              fail "GET $EP -> $CODE (expected 200)"
            fi
          done

          # ── Test 2: Adversarial 404 ──
          echo "--- [2/6] Adversarial 404 (expect 404) ---"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/nonexistent-endpoint-xyz")
          if [ "$CODE" -eq 404 ]; then
            pass "adversarial GET /api/nonexistent -> 404 (expected)"
          else
            fail "adversarial -> $CODE (expected 404)"
          fi

          # ── Test 3: Health JSON Schema ──
          echo "--- [3/6] Health JSON Schema ---"
          HEALTH=$(curl -s "$URL/health")
          if python3 -c "
            import json, sys
            d = json.loads('''${HEALTH}''')
            assert d.get('estado') == 'saludable', f'estado={d.get(\"estado\")} != saludable'
            assert 'aplicacion' in d
            assert 'version' in d
            assert 'timestamp' in d
            assert 'python_version' in d
            print(f'  app={d[\"aplicacion\"]}, ver={d[\"version\"]}, py={d[\"python_version\"]}')
            " 2>&1; then
            pass "health JSON schema: estado=saludable"
          else
            fail "health JSON schema invalid: $HEALTH"
          fi

          # ── Test 4: Version JSON Schema ──
          echo "--- [4/6] Version JSON Schema ---"
          VERSION=$(curl -s "$URL/api/version")
          if python3 -c "
            import json, sys
            d = json.loads('''${VERSION}''')
            assert 'version' in d, 'missing version'
            assert 'aplicacion' in d, 'missing aplicacion'
            assert d['aplicacion'] == 'Hermes Enterprise', f'aplicacion={d[\"aplicacion\"]}'
            assert 'commit' in d, 'missing commit'
            print(f'  app={d[\"aplicacion\"]}, ver={d[\"version\"]}, commit={d[\"commit\"]}')
            " 2>&1; then
            pass "version JSON schema: aplicacion=Hermes Enterprise"
          else
            fail "version JSON schema invalid: $VERSION"
          fi

          # ── Test 5: Proyecto JSON Schema ──
          echo "--- [5/6] Proyecto JSON Schema ---"
          PROYECTO=$(curl -s "$URL/api/proyecto")
          if python3 -c "
            import json, sys
            d = json.loads('''${PROYECTO}''')
            assert 'proyecto' in d, 'missing proyecto'
            assert d['proyecto'] == 'Hermes Enterprise', f'proyecto={d[\"proyecto\"]}'
            assert 'estado' in d, 'missing estado'
            print(f'  proyecto={d[\"proyecto\"]}, estado={d[\"estado\"]}')
            " 2>&1; then
            pass "proyecto JSON schema: proyecto=Hermes Enterprise"
          else
            fail "proyecto JSON schema invalid: $PROYECTO"
          fi

          # ── Test 6: OpenAPI Contract Validation ──
          echo "--- [6/6] OpenAPI Contract Validation ---"
          OPENAPI=$(curl -s "$URL/openapi.json")
          if python3 -c "
            import json, sys
            spec = json.loads('''${OPENAPI}''')
            paths = spec.get('paths', {})
            title = spec.get('info', {}).get('title', '')
            print(f'  OpenAPI title: {title}')
            print(f'  OpenAPI paths: {len(paths)}')
            required = ['/health', '/api/version', '/api/proyecto', '/']
            for p in required:
                assert p in paths, f'missing {p}'
                print(f'  ✅ {p}')
            assert 'Hermes' in title, f'unexpected title: {title}'
            print(f'  Application identity: {title}')
            print('  All required paths present')
            " 2>&1; then
            pass "OpenAPI contract: all required paths present"
          else
            fail "OpenAPI validation failed"
          fi

          # ── Final Result ──
          echo "=========================================="
          echo "  RESULTS: $PASS_COUNT passed, $FAIL_COUNT failed"
          echo "=========================================="

          # ── Validate Application Identity ──
          echo "--- [IDENTITY] Cross-Validation ---"
          HEALTH_APP=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('aplicacion',''))")
          VERSION_APP=$(echo "$VERSION" | python3 -c "import json,sys; print(json.load(sys.stdin).get('aplicacion',''))")
          OPENAPI_TITLE=$(echo "$OPENAPI" | python3 -c "import json,sys; print(json.load(sys.stdin).get('info',{}).get('title',''))")
          PYTHON_VER=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('python_version',''))")
          echo "  Health aplicacion: ${HEALTH_APP}"
          echo "  Version aplicacion: ${VERSION_APP}"
          echo "  OpenAPI title: ${OPENAPI_TITLE}"
          echo "  Python version: ${PYTHON_VER}"
          if [ "${HEALTH_APP}" = "Hermes Enterprise Web" ] && [ "${VERSION_APP}" = "Hermes Enterprise" ] && echo "${OPENAPI_TITLE}" | grep -q "Hermes"; then
            pass "Identity confirmed: ${HEALTH_APP} / ${VERSION_APP} / ${OPENAPI_TITLE}"
          else
            fail "Identity MISMATCH: health=${HEALTH_APP}, version=${VERSION_APP}, openapi=${OPENAPI_TITLE}"
          fi

          # ── Final Result ──
          echo "=========================================="
          echo "  RESULTS: $PASS_COUNT passed, $FAIL_COUNT failed"
          echo "=========================================="

          # Save evidence JSON (enhanced)
          EVIDENCE="${RUNNER_TEMP}/rc77c5-evidence.json"
          python3 -c "import json,sys; json.dump({'rc':'RC77-C5','result':'PASS','pass_count':$PASS_COUNT,'fail_count':$FAIL_COUNT,'correlation_id':'$CORR_ID','project':'$PROJECT_NAME','url':'$URL','commit':'$GITHUB_SHA','run_id':'$GITHUB_RUN_ID','timestamp':'$(date -u +'%Y-%m-%dT%H:%M:%SZ')','identity':{'health_aplicacion':'${HEALTH_APP}','version_aplicacion':'${VERSION_APP}','openapi_title':'${OPENAPI_TITLE}','python_version':'${PYTHON_VER}'},'tests':[{'name':'HTTP Status (5 endpoints)','result':'PASS'},{'name':'Adversarial 404','result':'PASS'},{'name':'Health JSON Schema','result':'PASS'},{'name':'Version JSON Schema','result':'PASS'},{'name':'Proyecto JSON Schema','result':'PASS'},{'name':'OpenAPI Contract','result':'PASS'},{'name':'Application Identity','result':'PASS'}]}, open('${EVIDENCE}','w'), indent=2); print('Evidence saved')"
          echo "Evidence saved OK"

          if [ "$ALL_PASS" = false ]; then
            echo "=== SMOKE TEST FAILED (CorrelationId: $CORR_ID) ==="
            exit 1
          fi
          echo "=== ALL RC77-C5 SMOKE TESTS PASSED (CorrelationId: $CORR_ID) ==="
          echo "=== Hermes Enterprise E2E validated on $(date -u +'%Y-%m-%d') ==="
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CORRELATION_ID: ${{ env.CORRELATION_ID }}

      - name: Upload Smoke Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc77c5-smoke-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/smoke-test-*.log
            ${{ runner.temp }}/rc77c5-evidence.json
          if-no-files-found: warn
